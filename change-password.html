<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>პაროლის შეცვლა - GABJI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b0813;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .pwd-screen {
      width: 100%;
      max-width: 412px;
      min-height: 100vh;
      background-color: #0b0813;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0 20px 30px 20px;
    }

    /* ზედა ჰედერი */
    .pwd-header {
      height: 52px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-back {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      margin-left: -6px;
    }

    .pwd-title {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 24px;
    }

    /* ინპუტის ველი */
    .input-box {
      position: relative;
      width: 100%;
      background-color: #1a1626;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 52px;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: rgba(254, 44, 85, 0.6);
    }

    .input-field {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      user-select: auto;
    }

    .input-field::placeholder {
      color: #6a647d;
    }

    .btn-toggle-eye {
      background: none;
      border: none;
      color: #8a84a0;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    /* კრიტერიუმების სია */
    .rules-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rule-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13.5px;
      color: #7b7590;
      transition: color 0.2s;
    }

    .rule-icon {
      font-size: 14px;
      line-height: 1.2;
    }

    /* დაკმაყოფილებული კრიტერიუმი */
    .rule-item.valid {
      color: #25c974;
    }

    /* შეცდომის შეტყობინება */
    .error-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #fe2c55;
      display: none;
    }

    /* ქვედა ღილაკი */
    .btn-submit {
      width: 100%;
      height: 48px;
      border-radius: 24px;
      border: none;
      background-color: rgba(254, 44, 85, 0.35); /* არააქტიური ფერი */
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
      font-weight: 600;
      cursor: not-allowed;
      transition: all 0.2s ease;
    }

    .btn-submit.active {
      background-color: #fe2c55; /* აქტიური TikTok წითელი */
      color: #ffffff;
      cursor: pointer;
    }

    .btn-submit:active.active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="pwd-screen">

    <div>
      <!-- უკან დაბრუნება -->
      <header class="pwd-header">
        <button class="btn-back" onclick="window.location.href='account.html'" aria-label="უკან">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </header>

      <h1 class="pwd-title">პაროლის შეცვლა</h1>

      <!-- პაროლის ველი -->
      <div class="input-box">
        <input type="password" id="pwdInput" class="input-field" placeholder="პაროლი" autocomplete="new-password">
        <button type="button" class="btn-toggle-eye" id="btnToggleEye" aria-label="Show Password">
          <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>

      <!-- წესების სია (ტიკტოკის ანალოგიური) -->
      <div class="rules-list">
        <div class="rule-item" id="ruleLength">
          <span class="rule-icon">✓</span>
          <span>8 სიმბოლო (მაქსიმუმ 20)</span>
        </div>
        <div class="rule-item" id="ruleChars">
          <span class="rule-icon">✓</span>
          <span>1 ასო, 1 ციფრი, 1 სპეციალური სიმბოლო (# ? ! @ და ა.შ.)</span>
        </div>
        <div class="rule-item" id="ruleStrength">
          <span class="rule-icon">✓</span>
          <span>საიმედო პაროლი</span>
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- გაგრძელების ღილაკი -->
    <button type="button" class="btn-submit" id="btnSubmit">გაგრძელება</button>

  </div>

  <!-- Firebase Auth ლოგიკა -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAj8VZVZYI_UVZlflTQk3MAljdS5Rxfrv0",
      authDomain: "gabji-b583c.firebaseapp.com",
      projectId: "gabji-b583c",
      storageBucket: "gabji-b583c.firebasestorage.app",
      messagingSenderId: "359136388859",
      appId: "1:359136388859:web:5c3448fecd29052755f25e",
      measurementId: "G-CM03PR8K8S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const pwdInput = document.getElementById("pwdInput");
    const btnToggleEye = document.getElementById("btnToggleEye");
    const btnSubmit = document.getElementById("btnSubmit");
    const errorMsg = document.getElementById("errorMsg");

    const ruleLength = document.getElementById("ruleLength");
    const ruleChars = document.getElementById("ruleChars");
    const ruleStrength = document.getElementById("ruleStrength");

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        currentUser = user;
      }
    });

    // პაროლის გამოჩენა / დამალვა
    let showPwd = false;
    btnToggleEye.onclick = () => {
      showPwd = !showPwd;
      pwdInput.type = showPwd ? "text" : "password";
      btnToggleEye.innerHTML = showPwd
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
    };

    // ვალიდაციის შემოწმება აკრეფისას
    pwdInput.addEventListener("input", () => {
      const val = pwdInput.value;
      errorMsg.style.display = "none";

      // 1. სიგრძე: 8-20
      const isLenValid = val.length >= 8 && val.length <= 20;
      ruleLength.classList.toggle("valid", isLenValid);

      // 2. 1 ასო, 1 ციფრი, 1 სპეც. სიმბოლო
      const hasLetter = /[a-zA-Z]/.test(val);
      const hasNumber = /[0-9]/.test(val);
      const hasSpecial = /[^a-zA-Z0-9]/.test(val);
      const isCharsValid = hasLetter && hasNumber && hasSpecial;
      ruleChars.classList.toggle("valid", isCharsValid);

      // 3. საიმედოობა
      const isStrong = isLenValid && isCharsValid && !/(1234|abcd|password)/i.test(val);
      ruleStrength.classList.toggle("valid", isStrong);

      // ღილაკის გააქტიურება
      if (isLenValid && isCharsValid && isStrong) {
        btnSubmit.classList.add("active");
        btnSubmit.disabled = false;
      } else {
        btnSubmit.classList.remove("active");
        btnSubmit.disabled = true;
      }
    });

    // პაროლის შენახვა Firebase-ში
    btnSubmit.onclick = async () => {
      if (!btnSubmit.classList.contains("active") || !currentUser) return;

      btnSubmit.disabled = true;
      btnSubmit.textContent = "იცვლება...";

      try {
        await updatePassword(currentUser, pwdInput.value);
        alert("პაროლი წარმატებით შეიცვალა!");
        window.location.href = "account.html";
      } catch (err) {
        console.error("პაროლის შეცვლის შეცდომა:", err);
        errorMsg.style.display = "block";

        if (err.code === "auth/requires-recent-login") {
          errorMsg.textContent = "უსაფრთხოების მიზნით, გთხოვთ ხელახლა გაიაროთ ავტორიზაცია.";
        } else {
          errorMsg.textContent = "პაროლის შეცვლა ვერ მოხერხდა: " + err.message;
        }
        btnSubmit.disabled = false;
        btnSubmit.textContent = "გაგრძელება";
      }
    };
  </script>
</body>
</html>
