<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GABJI - ფიდი (გაცნობა)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-screen feed-screen">
    <div class="content-layer feed-layout">

      <!-- ზედა საძიებო ზოლი და ფილტრი -->
      <div class="feed-top-bar">
        <div class="search-input-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="feed-search-input" placeholder="Search" data-i18n-ph="ph_search">
        </div>

        <div class="filter-toggle-wrap">
          <span class="filter-label" data-i18n="lbl_filter">Filter:</span>
          <label class="toggle-switch">
            <input type="checkbox" id="filterToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- ბარათების კონტეინერი (Swipe Card Deck) -->
      <div class="cards-deck-container">
        <!-- უკანა ფენის ჩრდილოვანი ბარათი ვიზუალური სიღრმისთვის -->
        <div class="deck-card-shadow"></div>

        <!-- მთავარი ბარათი (ფოტოს გარეშე - ნეიტრალური კონტეინერი) -->
        <div class="main-profile-card">
          <div class="card-image-placeholder">
            <!-- ნეიტრალური ავატარის აიკონი ფოტოს მაკეტის ნაცვლად -->
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            
            <div class="card-top-badge">
              <span class="badge-dot"></span>
            </div>
          </div>

          <!-- ბარათის ქვედა ინფორმაციის ბლოკი -->
          <div class="card-info-glass">
            <div class="card-name-row">
              <h3 class="card-user-title"></h3>
              <button type="button" class="mini-fav-btn" aria-label="Favorite">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#e57373">
                  <path d="M12 21.35C7 16.5 3 13 3 8.5 3 5.4 5.4 3 8.5 3c1.74 0 3.41.81 3.5 2 .09-1.19 1.76-2 3.5-2 3.1 0 5.5 2.4 5.5 5.5 0 4.5-4 8-9 12.85z"/>
                </svg>
              </button>
            </div>

            <p class="card-distance-text"></p>
            <p class="card-bio-text"></p>

            <div class="card-interest-pills"></div>
          </div>
        </div>
      </div>

      <!-- Like / Pass მრგვალი ღილაკები -->
      <div class="card-action-buttons">
        <button type="button" class="action-circle-btn btn-like" id="likeBtn">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#ff7597">
            <path d="M12 21.35C7 16.5 3 13 3 8.5 3 5.4 5.4 3 8.5 3c1.74 0 3.41.81 3.5 2 .09-1.19 1.76-2 3.5-2 3.1 0 5.5 2.4 5.5 5.5 0 4.5-4 8-9 12.85z"/>
          </svg>
          <span class="btn-caption" data-i18n="btn_like">Like</span>
        </button>

        <button type="button" class="action-circle-btn btn-pass" id="passBtn">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e07a7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span class="btn-caption" data-i18n="btn_pass">Pass</span>
        </button>
      </div>

    </div>
  </div>

  <!-- სრულიად დამოუკიდებელი ქვედა ნავიგაცია (კონტეინერების გარეთ) -->
  <!-- TikTok სტილის ქვედა ნავიგაცია -->
<nav class="bottom-nav-bar">
  <!-- 1. მთავარი / ფიდი -->
  <a href="feed.html" class="nav-item">
    <img src="icons/home-outline.svg" alt="Home" class="nav-svg-icon">
    <span data-i18n="nav_feed">ფიდი</span>
  </a>

  <!-- 2. მეგობრები / რელსები -->
  <a href="users.html" class="nav-item">
  <img src="icons/users-group-rounded-bold.svg" alt="Users" class="nav-svg-icon" style="pointer-events: none;">
  <span style="pointer-events: none;" data-i18n="nav_people">ხალხი</span>
</a>


  <!-- 3. ცენტრალური ატვირთვის ღილაკი (+) -->
  <a href="reels.html" class="nav-item">
  <img src="icons/clapperboard-play-broken.svg" alt="Reels" class="nav-svg-icon" style="pointer-events: none;">
  <span style="pointer-events: none;" data-i18n="nav_reels">რელსები</span>
</a>



  <!-- 4. შემოსულები / ჩატი წითელი ბეიჯით -->
  <a href="#" class="nav-item nav-inbox-wrap">
    <div class="nav-icon-badge-box">
      <img src="icons/message-circle.svg" alt="Inbox" class="nav-svg-icon">
      <span class="nav-unread-badge">26</span>
    </div>
    <span data-i18n="nav_inbox">შემოსულები</span>
  </a>

  <!-- 5. პროფილი -->
  <a href="profile.html" class="nav-item active">
    <img src="icons/user-broken.svg" alt="Profile" class="nav-svg-icon">
    <span data-i18n="nav_profile">პროფილი</span>
  </a>
</nav>

  <script type="module" src="app.js"></script>
</body>
</html>
