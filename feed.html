<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GABJI - ფიდი</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="feed-body">

  <div class="app-screen feed-screen-fb">
    <!-- პოსტების მთავარი ნაკადი -->
    <main class="feed-posts-stream" id="feedPostsContainer">
      <div class="feed-loading-state" id="feedLoadingText">პოსტები იტვირთება...</div>
    </main>
  </div>

  <!-- ქვედა ნავიგაცია (შენი ზუსტი აიკონებით და ბეიჯით) -->
  <nav class="bottom-nav-bar">
    <a href="feed.html" class="nav-item active">
      <img src="icons/home-outline.svg" alt="Home" class="nav-svg-icon">
      <span data-i18n="nav_feed">ფიდი</span>
    </a>

    <a href="users.html" class="nav-item">
      <img src="icons/users-group-rounded-bold.svg" alt="Users" class="nav-svg-icon">
      <span data-i18n="nav_people">ხალხი</span>
    </a>

    <a href="reels.html" class="nav-item">
      <img src="icons/clapperboard-play-broken.svg" alt="Reels" class="nav-svg-icon">
      <span data-i18n="nav_reels">რელსები</span>
    </a>

    <a href="messages.html" class="nav-item nav-inbox-wrap">
      <div class="nav-icon-badge-box">
        <img src="icons/message-circle.svg" alt="Inbox" class="nav-svg-icon">
        <span class="nav-unread-badge" id="globalInboxBadge" style="display: none;">0</span>
      </div>
      <span data-i18n="nav_inbox">შემოსულები</span>
    </a>

    <a href="profile.html" class="nav-item">
      <img src="icons/user-broken.svg" alt="Profile" class="nav-svg-icon">
      <span data-i18n="nav_profile">პროფილი</span>
    </a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
