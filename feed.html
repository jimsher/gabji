<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GABJI - ფიდი (გაცნობა)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-screen feed-screen">
    <div class="content-layer feed-layout">

      <!-- ზედა საძიებო ზოლი და ფილტრი -->
      <div class="feed-top-bar">
        <div class="search-input-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="feed-search-input" placeholder="Search">
        </div>

        <div class="filter-toggle-wrap">
          <span class="filter-label">Filter:</span>
          <label class="toggle-switch">
            <input type="checkbox" id="filterToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- ბარათების კონტეინერი (Swipe Card Deck) -->
      <div class="cards-deck-container">
        <!-- უკანა ფენის ჩრდილოვანი ბარათი ვიზუალური სიღრმისთვის -->
        <div class="deck-card-shadow"></div>

        <!-- მთავარი ბარათი (ფოტოს გარეშე - ნეიტრალური კონტეინერი) -->
        <div class="main-profile-card">
          <div class="card-image-placeholder">
            <!-- ნეიტრალური ავატარის აიკონი ფოტოს მაკეტის ნაცვლად -->
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            
            <div class="card-top-badge">
              <span class="badge-dot"></span>
            </div>
          </div>

          <!-- ბარათის ქვედა ინფორმაციის ბლოკი -->
          <div class="card-info-glass">
            <div class="card-name-row">
              <h3 class="card-user-title"></h3>
              <button type="button" class="mini-fav-btn" aria-label="Favorite">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#e57373">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
              </button>
            </div>

            <p class="card-distance-text"></p>
            <p class="card-bio-text"></p>

            <div class="card-interest-pills"></div>
          </div>
        </div>
      </div>

      <!-- Like / Pass მრგვალი ღილაკები -->
      <div class="card-action-buttons">
        <button type="button" class="action-circle-btn btn-like" id="likeBtn">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#ff7597">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="btn-caption">Like</span>
        </button>

        <button type="button" class="action-circle-btn btn-pass" id="passBtn">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e07a7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span class="btn-caption">Pass</span>
        </button>
      </div>

      <!-- ქვედა ნავიგაცია -->
      <nav class="bottom-nav-bar">
        <a href="feed.html" class="nav-item active">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>ფიდი</span>
        </a>
        <a href="#" class="nav-item">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>ჩატი</span>
        </a>
        <a href="signup.html" class="nav-item">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>პროფილი</span>
        </a>
      </nav>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
