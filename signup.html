<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GABJI - შექმენი პროფილი</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-screen">
    <div class="content-layer">

      <!-- ზედა ზოლი -->
      <div class="signup-top-bar">
        <a href="index.html" class="back-link">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
      </div>

      <!-- სათაური -->
      <div class="signup-header">
        <h2 class="signup-title">შექმენი პროფილი</h2>
        <p class="signup-sub">Personalized onboard setup</p>
      </div>

      <!-- ფორმა -->
      <form id="signupForm" class="signup-form">

        <!-- სახელი და გვარი -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="input-label">სახელი</label>
            <input type="text" id="regFirstName" class="input-box" placeholder="სახელი" required>
          </div>
          <div class="form-group flex-1">
            <label class="input-label">გვარი</label>
            <input type="text" id="regLastName" class="input-box" placeholder="გვარი" required>
          </div>
        </div>

        <!-- დაბადების თარიღი -->
        <div class="form-group">
          <label class="input-label">დაბადების თარიღი</label>
          <input type="date" id="regBirthDate" class="input-box" required>
        </div>

        <!-- ქვეყანა და ქალაქი -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="input-label">ქვეყანა</label>
            <input type="text" id="regCountry" class="input-box" placeholder="ქვეყანა" required>
          </div>
          <div class="form-group flex-1">
            <label class="input-label">ქალაქი</label>
            <input type="text" id="regCity" class="input-box" placeholder="ქალაქი" required>
          </div>
        </div>

        <!-- მეილი -->
        <div class="form-group">
          <label class="input-label">ელ-ფოსტა</label>
          <input type="email" id="regEmail" class="input-box" placeholder="example@mail.com" required>
        </div>

        <!-- პაროლი -->
        <div class="form-group">
          <label class="input-label">პაროლი</label>
          <input type="password" id="regPassword" class="input-box" placeholder="მინიმუმ 6 სიმბოლო" minlength="6" required>
        </div>

        <!-- ტელეფონი -->
        <div class="form-group">
          <label class="input-label">ტელეფონის ნომერი</label>
          <input type="tel" id="regPhone" class="input-box" placeholder="+995 5xx xx xx xx" required>
        </div>

        <!-- ინტერესები (ზუსტად სურათის ტექსტებით) -->
        <div class="form-group">
          <label class="input-label">ინტერესები</label>
          <div class="interest-tags-container" id="interestsContainer">
            <button type="button" class="interest-pill">ინტერესები</button>
            <button type="button" class="interest-pill">ახალი</button>
            <button type="button" class="interest-pill">ინტერესები</button>
            <button type="button" class="interest-pill">ახალისხაბი</button>
            <button type="button" class="interest-pill">ინტერესბი</button>
          </div>
        </div>

        <!-- ფოტოს ატვირთვა -->
        <div class="form-group">
          <input type="file" id="userPhoto" accept="image/*" style="display: none;">
          <div class="photo-upload-card" id="uploadCard">
            <svg class="camera-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span class="upload-text" id="uploadLabel">ფოტოს ატვირთვა</span>
          </div>
        </div>

        <!-- რეგისტრაციის ღილაკი -->
        <div class="form-group action-bottom">
          <button type="submit" class="btn-gradient" id="submitBtn">შესვლა</button>
        </div>

      </form>

      <!-- ქვედა ნავიგაცია -->
      <nav class="bottom-nav-bar">
        <div class="nav-item">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>ფიდი</span>
        </div>
        <div class="nav-item">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>ჩატი</span>
        </div>
        <div class="nav-item active">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>პროფილი</span>
        </div>
      </nav>

    </div>
  </div>

  <script type="module" src="signup.js"></script>
</body>
</html>
