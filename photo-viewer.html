<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ფოტოების დათვალიერება</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ვერტიკალური Snap სლაიდერი */
    .viewer-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .viewer-container::-webkit-scrollbar {
      display: none;
    }

    .photo-slide {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .photo-slide img.main-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Double Tap გულის ანიმაცია ცენტრში */
    .double-tap-heart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 110px;
      height: 110px;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    .double-tap-heart.active {
      transform: translate(-50%, -50%) scale(1.15);
      opacity: 0.95;
    }

    /* ზედა ნავიგაცია (უკან დაბრუნება) */
    .top-bar {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 50;
      display: flex;
      align-items: center;
    }

    .back-btn {
      background: rgba(0, 0, 0, 0.4);
      border: none;
      color: #ffffff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .back-btn svg {
      width: 26px;
      height: 26px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2.5;
    }

    /* მარჯვენა მოქმედებების პანელი */
    .reels-sidebar {
      position: absolute;
      right: 12px;
      bottom: 55px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 20;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
    }

    .action-icon-wrap {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reel-action-icon {
      width: 38px;
      height: 38px;
      filter: brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9));
      object-fit: contain;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .action-item:active .reel-action-icon {
      transform: scale(0.85);
    }

    .btn-like.liked .reel-action-icon {
      filter: drop-shadow(0 2px 6px rgba(254, 44, 85, 0.6)) invert(27%) sepia(91%) saturate(5412%) hue-rotate(338deg) brightness(98%) contrast(106%);
    }

    .action-count {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .btn-photo-more {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding-top: 2px;
    }

    .action-dots-text {
      font-size: 32px;
      letter-spacing: 2px;
      line-height: 1;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .bottom-info {
      position: absolute;
      left: 15px;
      bottom: 25px;
      color: #ffffff;
      z-index: 20;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .user-handle {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }

    .loading-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888888;
      font-size: 14px;
    }

    /* ==========================================================================
       კომენტარების სუფთა Bottom Sheet მოდალი
       ========================================================================== */
    .comments-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .comments-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .comments-sheet {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 75%;
      background: #ffffff;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.2);
    }

    .comments-sheet.active {
      transform: translateY(0);
    }

    .comments-header {
      position: relative;
      padding: 14px 16px;
      text-align: center;
      border-bottom: 1px solid #f0f2f5;
      flex-shrink: 0;
    }

    .comments-title {
      color: #111111;
      font-size: 15px;
      font-weight: 700;
    }

    .comments-close-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: #f0f2f5;
      border: none;
      color: #555555;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .comments-close-btn:active {
      background: #e4e6eb;
    }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #ffffff;
      -webkit-overflow-scrolling: touch;
    }

    .comments-list::-webkit-scrollbar {
      display: none;
    }

    /* მთავარი კომენტარი */
    .comment-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comment-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      position: relative;
    }

    .comment-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .comment-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: transparent;
      padding: 0;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 700;
      color: #111111;
    }

    .comment-text {
      font-size: 14px;
      color: #111111;
      line-height: 1.35;
      word-break: break-word;
    }

    .comment-meta-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 4px;
    }

    .comment-time {
      font-size: 12px;
      color: #8a8d91;
    }

    .comment-reply-btn {
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 600;
      color: #8a8d91;
      cursor: pointer;
      padding: 0;
    }

    .comment-reply-btn:active {
      color: #111111;
    }

    /* მარჯვენა მოქმედებები: გული და დისლაიქი */
    .comment-actions-right {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 2px;
      flex-shrink: 0;
    }

    .comment-action-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      padding: 0;
    }

    .comment-icon-svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: #737373;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.15s ease, fill 0.15s ease;
    }

    .comment-action-btn.liked .comment-icon-svg {
      fill: #fe2c55;
      stroke: #fe2c55;
    }

    .comment-action-btn.disliked .comment-icon-svg {
      fill: #111111;
      stroke: #111111;
    }

    .comment-like-count {
      font-size: 11px;
      color: #8a8d91;
      font-weight: 600;
    }

    /* რეალური ქვე-კომენტარების ჩამონათვალი (შეწეული) */
    .replies-container {
      margin-left: 48px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 2px solid #f0f2f5;
      padding-left: 12px;
    }

    .reply-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .reply-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* პასუხის გაცემის საინფორმაციო ზოლი ინპუტის თავზე */
    .replying-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      background: #f0f2f5;
      font-size: 12px;
      color: #65676b;
      border-top: 1px solid #e4e6eb;
    }

    .replying-banner.active {
      display: flex;
    }

    .cancel-reply-btn {
      background: none;
      border: none;
      color: #fe2c55;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .no-comments-text {
      color: #8a8d91;
      text-align: center;
      font-size: 14px;
      margin-top: 40px;
    }

    .comments-input-bar {
      padding: 10px 14px;
      background: #ffffff;
      border-top: 1px solid #f0f2f5;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .comment-input-field {
      flex: 1;
      background: #f0f2f5;
      border: none;
      outline: none;
      padding: 10px 16px;
      border-radius: 20px;
      color: #111111;
      font-size: 14px;
    }

    .comment-input-field::placeholder {
      color: #8a8d91;
    }

    .comment-send-btn {
      background: #1877f2;
      border: none;
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .comment-send-btn svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
      transform: translateX(1px);
    }
  </style>
</head>
<body>

  <!-- ზედა ღილაკი: უკან დაბრუნება -->
  <div class="top-bar">
    <button type="button" class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  </div>

  <div class="viewer-container" id="slidesViewport">
    <div class="loading-state" id="loadingText">ფოტოები იტვირთება...</div>
  </div>

  <!-- კომენტარების მოდალი -->
  <div class="comments-backdrop" id="commentsBackdrop" onclick="window.closeCommentsModal()"></div>
  <div class="comments-sheet" id="commentsSheet">
    <div class="comments-header">
      <span class="comments-title" id="commentsSheetTitle">კომენტარები</span>
      <button type="button" class="comments-close-btn" id="commentsCloseBtn" onclick="window.closeCommentsModal()">✕</button>
    </div>

    <div class="comments-list" id="commentsList">
      <div class="no-comments-text">იტვირთება...</div>
    </div>

    <!-- პასუხის ინდიკატორი -->
    <div class="replying-banner" id="replyingBanner">
      <span id="replyingText">პასუხობთ: მომხმარებელს</span>
      <button type="button" class="cancel-reply-btn" id="cancelReplyBtn">გაუქმება</button>
    </div>

    <div class="comments-input-bar">
      <input type="text" class="comment-input-field" id="commentInput" placeholder="დაამატე კომენტარი..." autocomplete="off">
      <button type="button" class="comment-send-btn" id="commentSendBtn" aria-label="გაგზავნა">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      doc, 
      getDoc, 
      setDoc, 
      deleteDoc, 
      updateDoc, 
      increment, 
      serverTimestamp,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAj8VZVZYI_UVZlflTQk3MAljdS5Rxfrv0",
      authDomain: "gabji-b583c.firebaseapp.com",
      projectId: "gabji-b583c",
      storageBucket: "gabji-b583c.firebasestorage.app",
      messagingSenderId: "359136388859",
      appId: "1:359136388859:web:5c3448fecd29052755f25e",
      measurementId: "G-CM03PR8K8S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const targetUid = params.get("uid");
    const initialPhotoId = params.get("photoId");

    const viewport = document.getElementById("slidesViewport");
    const loadingText = document.getElementById("loadingText");

    // კომენტარების ელემენტები
    const commentsBackdrop = document.getElementById("commentsBackdrop");
    const commentsSheet = document.getElementById("commentsSheet");
    const commentsCloseBtn = document.getElementById("commentsCloseBtn");
    const commentsList = document.getElementById("commentsList");
    const commentInput = document.getElementById("commentInput");
    const commentSendBtn = document.getElementById("commentSendBtn");
    const commentsSheetTitle = document.getElementById("commentsSheetTitle");
    const replyingBanner = document.getElementById("replyingBanner");
    const replyingText = document.getElementById("replyingText");
    const cancelReplyBtn = document.getElementById("cancelReplyBtn");

    let activePhotoIdForComments = null;
    let activeCommentCountEl = null;
    let currentUserProfileData = null;

    // ქვე-კომენტარის მდგომარეობა
    let activeReplyParentId = null;
    let activeReplyUserName = null;

    // გლობალური დახურვა „X“-ისთვის
    window.closeCommentsModal = () => {
      if (commentsSheet) commentsSheet.classList.remove("active");
      if (commentsBackdrop) commentsBackdrop.classList.remove("active");
      activePhotoIdForComments = null;
      activeCommentCountEl = null;
      cancelReplyMode();
    };

    const cancelReplyMode = () => {
      activeReplyParentId = null;
      activeReplyUserName = null;
      if (replyingBanner) replyingBanner.classList.remove("active");
      if (commentInput) {
        commentInput.placeholder = "დაამატე კომენტარი...";
      }
    };

    if (cancelReplyBtn) cancelReplyBtn.onclick = cancelReplyMode;

    // პასუხის რეჟიმის გააქტიურება
    window.initReply = (parentId, userName) => {
      activeReplyParentId = parentId;
      activeReplyUserName = userName;
      if (replyingText) replyingText.textContent = `პასუხობთ: ${userName}`;
      if (replyingBanner) replyingBanner.classList.add("active");
      if (commentInput) {
        commentInput.placeholder = `უპასუხე ${userName}-ს...`;
        commentInput.focus();
      }
    };

    // კომენტარების ჩატვირთვა და სტრუქტურირება
    const openCommentsModal = async (photoId, countEl) => {
      activePhotoIdForComments = photoId;
      activeCommentCountEl = countEl;
      cancelReplyMode();

      commentsSheet.classList.add("active");
      commentsBackdrop.classList.add("active");
      commentsList.innerHTML = '<div class="no-comments-text">კომენტარები იტვირთება...</div>';

      try {
        const commentsRef = collection(db, "users", targetUid, "photos", photoId, "comments");
        const q = query(commentsRef, orderBy("createdAt", "asc"));
        const snapshot = await getDocs(q);

        if (commentsSheetTitle) {
          commentsSheetTitle.textContent = `${snapshot.size} კომენტარი`;
        }

        if (snapshot.empty) {
          commentsList.innerHTML = '<div class="no-comments-text">კომენტარები ჯერ არ არის</div>';
          return;
        }

        commentsList.innerHTML = "";

        const mainComments = [];
        const repliesMap = {};

        snapshot.forEach((cDoc) => {
          const data = { id: cDoc.id, ...cDoc.data() };
          if (data.parentId) {
            if (!repliesMap[data.parentId]) repliesMap[data.parentId] = [];
            repliesMap[data.parentId].push(data);
          } else {
            mainComments.push(data);
          }
        });

        mainComments.forEach((main) => {
          const block = document.createElement("div");
          block.className = "comment-block";
          block.id = `comment_block_${main.id}`;

          const replies = repliesMap[main.id] || [];

          let repliesHtml = "";
          if (replies.length > 0) {
            repliesHtml = `<div class="replies-container">`;
            replies.forEach((rep) => {
              repliesHtml += `
                <div class="reply-item">
                  <img src="${rep.userPhoto || 'icons/user-circle-linear.svg'}" class="reply-avatar" alt="Avatar">
                  <div class="comment-body">
                    <span class="comment-author">${rep.userName || 'მომხმარებელი'}</span>
                    <span class="comment-text">${rep.text || ''}</span>
                    <div class="comment-meta-bar">
                      <span class="comment-time">ახლახან</span>
                      <button type="button" class="comment-reply-btn" onclick="window.initReply('${main.id}', '${rep.userName || 'მომხმარებელი'}')">პასუხი</button>
                    </div>
                  </div>
                  <div class="comment-actions-right">
                    <button type="button" class="comment-action-btn" onclick="this.classList.toggle('liked')">
                      <svg class="comment-icon-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                  </div>
                </div>
              `;
            });
            repliesHtml += `</div>`;
          }

          block.innerHTML = `
            <div class="comment-item">
              <img src="${main.userPhoto || 'icons/user-circle-linear.svg'}" class="comment-avatar" alt="Avatar">
              
              <div class="comment-body">
                <span class="comment-author">${main.userName || 'მომხმარებელი'}</span>
                <span class="comment-text">${main.text || ''}</span>
                <div class="comment-meta-bar">
                  <span class="comment-time">ახლახან</span>
                  <button type="button" class="comment-reply-btn" onclick="window.initReply('${main.id}', '${main.userName || 'მომხმარებელი'}')">პასუხი</button>
                </div>
              </div>

              <!-- ნამდვილი გული და დისლაიქი (ცერა თითი ქვემოთ) -->
              <div class="comment-actions-right">
                <button type="button" class="comment-action-btn" onclick="this.classList.toggle('liked'); this.nextElementSibling.classList.remove('disliked');">
                  <svg class="comment-icon-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                  <span class="comment-like-count"></span>
                </button>
                
                <button type="button" class="comment-action-btn" onclick="this.classList.toggle('disliked'); this.previousElementSibling.classList.remove('liked');">
                  <svg class="comment-icon-svg" viewBox="0 0 24 24"><path d="M15 3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4.5l-.7 3.6-.03.3a1.5 1.5 0 0 0 .44 1.06L11.27 21 17.64 14.63c.23-.23.36-.55.36-.88V5a2 2 0 0 0-2-2zm-9 2h9v8.73L10.36 18.5 11.5 13H6V5zm14 0h3v10h-3z"/></svg>
                </button>
              </div>
            </div>

            ${repliesHtml}
          `;

          commentsList.appendChild(block);
        });

        commentsList.scrollTop = commentsList.scrollHeight;
      } catch (err) {
        console.error("კომენტარების ჩატვირთვის შეცდომა:", err);
        commentsList.innerHTML = '<div class="no-comments-text">კომენტარების ჩატვირთვა ვერ მოხერხდა</div>';
      }
    };

    // ახალი კომენტარის / ქვე-კომენტარის გაგზავნა
    const sendComment = async () => {
      const text = commentInput.value.trim();
      if (!text || !activePhotoIdForComments) return;

      const user = auth.currentUser;
      if (!user) {
        alert("კომენტარის დასაწერად გაიარეთ ავტორიზაცია");
        return;
      }

      commentInput.value = "";
      commentSendBtn.disabled = true;

      try {
        const photoRef = doc(db, "users", targetUid, "photos", activePhotoIdForComments);
        const commentsRef = collection(photoRef, "comments");

        const authorName = currentUserProfileData ? 
          `${currentUserProfileData.firstName || ''} ${currentUserProfileData.lastName || ''}`.trim() || 'მომხმარებელი' : 
          'მომხმარებელი';

        const authorPhoto = currentUserProfileData?.photoUrl || 'icons/user-circle-linear.svg';

        const commentPayload = {
          userId: user.uid,
          userName: authorName,
          userPhoto: authorPhoto,
          text: text,
          createdAt: serverTimestamp()
        };

        if (activeReplyParentId) {
          commentPayload.parentId = activeReplyParentId;
          commentPayload.replyToUser = activeReplyUserName;
        }

        const newDocRef = await setDoc(doc(commentsRef), commentPayload);
        await updateDoc(photoRef, { commentsCount: increment(1) });

        if (activeCommentCountEl) {
          const curr = parseInt(activeCommentCountEl.textContent) || 0;
          activeCommentCountEl.textContent = curr + 1;
        }

        const emptyNotice = commentsList.querySelector(".no-comments-text");
        if (emptyNotice) emptyNotice.remove();

        // UI-ს მომენტალური განახლება
        if (activeReplyParentId) {
          // ქვე-კომენტარი ემატება შესაბამის ბლოკს
          const parentBlock = document.getElementById(`comment_block_${activeReplyParentId}`);
          if (parentBlock) {
            let repliesWrap = parentBlock.querySelector(".replies-container");
            if (!repliesWrap) {
              repliesWrap = document.createElement("div");
              repliesWrap.className = "replies-container";
              parentBlock.appendChild(repliesWrap);
            }
            const replyItem = document.createElement("div");
            replyItem.className = "reply-item";
            replyItem.innerHTML = `
              <img src="${authorPhoto}" class="reply-avatar" alt="Avatar">
              <div class="comment-body">
                <span class="comment-author">${authorName}</span>
                <span class="comment-text">${text}</span>
                <div class="comment-meta-bar">
                  <span class="comment-time">ახლახან</span>
                  <button type="button" class="comment-reply-btn" onclick="window.initReply('${activeReplyParentId}', '${authorName}')">პასუხი</button>
                </div>
              </div>
              <div class="comment-actions-right">
                <button type="button" class="comment-action-btn" onclick="this.classList.toggle('liked')">
                  <svg class="comment-icon-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
              </div>
            `;
            repliesWrap.appendChild(replyItem);
          }
        } else {
          // მთავარი ახალი კომენტარი
          const block = document.createElement("div");
          block.className = "comment-block";
          block.innerHTML = `
            <div class="comment-item">
              <img src="${authorPhoto}" class="comment-avatar" alt="Avatar">
              <div class="comment-body">
                <span class="comment-author">${authorName}</span>
                <span class="comment-text">${text}</span>
                <div class="comment-meta-bar">
                  <span class="comment-time">ახლახან</span>
                  <button type="button" class="comment-reply-btn" onclick="window.initReply('${newDocRef?.id || Date.now()}', '${authorName}')">პასუხი</button>
                </div>
              </div>
              <div class="comment-actions-right">
                <button type="button" class="comment-action-btn" onclick="this.classList.toggle('liked'); this.nextElementSibling.classList.remove('disliked');">
                  <svg class="comment-icon-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                  <span class="comment-like-count"></span>
                </button>
                <button type="button" class="comment-action-btn" onclick="this.classList.toggle('disliked'); this.previousElementSibling.classList.remove('liked');">
                  <svg class="comment-icon-svg" viewBox="0 0 24 24"><path d="M15 3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4.5l-.7 3.6-.03.3a1.5 1.5 0 0 0 .44 1.06L11.27 21 17.64 14.63c.23-.23.36-.55.36-.88V5a2 2 0 0 0-2-2zm-9 2h9v8.73L10.36 18.5 11.5 13H6V5zm14 0h3v10h-3z"/></svg>
                </button>
              </div>
            </div>
          `;
          commentsList.appendChild(block);
        }

        commentsList.scrollTop = commentsList.scrollHeight;
        cancelReplyMode();

      } catch (sendErr) {
        console.error("კომენტარის გაგზავნის შეცდომა:", sendErr);
      } finally {
        commentSendBtn.disabled = false;
      }
    };

    if (commentSendBtn) commentSendBtn.onclick = sendComment;
    if (commentInput) {
      commentInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendComment();
      });
    }

    // ლაიქის გადართვა (Toggle Like)
    const toggleLike = async (photoId, btnLike, countEl) => {
      const user = auth.currentUser;
      if (!user) {
        alert("მოწონებისთვის გაიარეთ ავტორიზაცია");
        return;
      }

      btnLike.disabled = true;
      const isLiked = btnLike.classList.contains("liked");
      let count = parseInt(countEl.textContent) || 0;

      const photoRef = doc(db, "users", targetUid, "photos", photoId);
      const userLikeRef = doc(db, "users", targetUid, "photos", photoId, "likes", user.uid);
      const targetUserProfileRef = doc(db, "users", targetUid);

      try {
        if (!isLiked) {
          btnLike.classList.add("liked");
          count += 1;
          countEl.textContent = count;

          await setDoc(userLikeRef, { uid: user.uid, createdAt: serverTimestamp() });
          await updateDoc(photoRef, { likesCount: increment(1) });
          await updateDoc(targetUserProfileRef, { likesCount: increment(1) });
        } else {
          btnLike.classList.remove("liked");
          count = Math.max(0, count - 1);
          countEl.textContent = count;

          await deleteDoc(userLikeRef);
          await updateDoc(photoRef, { likesCount: increment(-1) });
          await updateDoc(targetUserProfileRef, { likesCount: increment(-1) });
        }
      } catch (err) {
        console.error("ლაიქის შეცდომა:", err);
      } finally {
        btnLike.disabled = false;
      }
    };

    const loadCollection = async (currentUserUid) => {
      if (!targetUid) {
        if (loadingText) loadingText.textContent = "პროფილი ვერ მოიძებნა";
        return;
      }

      try {
        let userHandle = "@user";
        const userDoc = await getDoc(doc(db, "users", targetUid));
        if (userDoc.exists()) {
          const u = userDoc.data();
          userHandle = u.username ? `@${u.username}` : (u.firstName ? `@${u.firstName.toUpperCase()} JI` : "@user");
        }

        if (currentUserUid) {
          const curUserDoc = await getDoc(doc(db, "users", currentUserUid));
          if (curUserDoc.exists()) {
            currentUserProfileData = curUserDoc.data();
          }
        }

        const photosSnap = await getDocs(collection(db, "users", targetUid, "photos"));
        
        if (photosSnap.empty) {
          if (loadingText) loadingText.textContent = "ფოტოები არ არის";
          return;
        }

        if (loadingText) loadingText.remove();

        const isOwner = currentUserUid && (currentUserUid === targetUid);
        let initialSlideElement = null;

        for (const docItem of photosSnap.docs) {
          const p = docItem.data();
          if (!p.photoUrl) continue;

          let alreadyLiked = false;
          if (currentUserUid) {
            const myLikeSnap = await getDoc(doc(db, "users", targetUid, "photos", docItem.id, "likes", currentUserUid));
            alreadyLiked = myLikeSnap.exists();
          }

          const slide = document.createElement("div");
          slide.className = "photo-slide";
          slide.id = `photo_${docItem.id}`;

          const ownerDotsHtml = isOwner ? `
            <button type="button" class="action-item btn-photo-more" data-id="${docItem.id}">
              <span class="action-dots-text">•••</span>
            </button>
          ` : '';

          slide.innerHTML = `
            <img src="${p.photoUrl}" alt="Photo" class="main-photo">

            <svg class="double-tap-heart" viewBox="0 0 24 24" fill="#fe2c55">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>

            <div class="reels-sidebar">
              <!-- ლაიქი -->
              <button class="action-item btn-like ${alreadyLiked ? 'liked' : ''}" data-id="${docItem.id}">
                <div class="action-icon-wrap">
                  <img src="icons/heart-bold.svg" class="reel-action-icon" alt="Like">
                </div>
                <span class="action-count like-count">${p.likesCount || p.likes || 0}</span>
              </button>

              <!-- კომენტარი -->
              <button class="action-item btn-comment" data-id="${docItem.id}">
                <div class="action-icon-wrap">
                  <img src="icons/chat-round-dots-bold.svg" class="reel-action-icon" alt="Comment">
                </div>
                <span class="action-count comment-count">${p.commentsCount || 0}</span>
              </button>

              <!-- შენახვა / სანიშნე -->
              <button class="action-item btn-save">
                <div class="action-icon-wrap">
                  <img src="icons/bookmark-bold.svg" class="reel-action-icon" alt="Save">
                </div>
                <span class="action-count">${p.savesCount || 0}</span>
              </button>

              <!-- გაზიარება -->
              <button class="action-item btn-share">
                <div class="action-icon-wrap">
                  <img src="icons/forward-right-bold.svg" class="reel-action-icon" alt="Share">
                </div>
                <span class="action-count">${p.sharesCount || p.shares || 0}</span>
              </button>

              <!-- სამი წერტილი გაზიარების ქვემოთ -->
              ${ownerDotsHtml}
            </div>

            <div class="bottom-info">
              <div class="user-handle">${userHandle}</div>
            </div>
          `;

          const btnLike = slide.querySelector(".btn-like");
          const likeCountEl = slide.querySelector(".like-count");
          btnLike.onclick = () => toggleLike(docItem.id, btnLike, likeCountEl);

          const btnComment = slide.querySelector(".btn-comment");
          const commentCountEl = slide.querySelector(".comment-count");
          btnComment.onclick = () => openCommentsModal(docItem.id, commentCountEl);

          let lastTap = 0;
          const photoImg = slide.querySelector(".main-photo");
          const heartAnim = slide.querySelector(".double-tap-heart");

          photoImg.addEventListener("click", () => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
              heartAnim.classList.add("active");
              setTimeout(() => heartAnim.classList.remove("active"), 800);

              if (!btnLike.classList.contains("liked")) {
                toggleLike(docItem.id, btnLike, likeCountEl);
              }
            }
            lastTap = currentTime;
          });

          viewport.appendChild(slide);

          if (docItem.id === initialPhotoId) {
            initialSlideElement = slide;
          }
        }

        if (initialSlideElement) {
          initialSlideElement.scrollIntoView();
        }

      } catch (err) {
        console.error("დათვალიერების შეცდომა:", err);
        if (loadingText) loadingText.textContent = "შეცდომა ჩატვირთვისას";
      }
    };

    onAuthStateChanged(auth, (user) => {
      loadCollection(user ? user.uid : null);
    });
  </script>
</body>
</html>
