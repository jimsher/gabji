<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ფოტოების დათვალიერება</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ვერტიკალური Snap სლაიდერი TikTok/Reels სტილში */
    .viewer-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .viewer-container::-webkit-scrollbar {
      display: none;
    }

    /* თითოეული სრულეკრანიანი ფოტო */
    .photo-slide {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .photo-slide img.main-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ზედა ნავიგაცია (უკან დაბრუნება) */
    .top-bar {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 50;
      display: flex;
      align-items: center;
    }

    .back-btn {
      background: rgba(0, 0, 0, 0.4);
      border: none;
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2.5;
    }

    /* მარჯვენა მოქმედებების პანელი */
    .right-actions {
      position: absolute;
      right: 12px;
      bottom: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 20;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
    }

    .action-custom-icon {
      width: 30px;
      height: 30px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));
      object-fit: contain;
    }

    .action-count {
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* ჰორიზონტალური სამი წერტილი გაზიარების ქვემოთ */
    .action-dots-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding-top: 4px;
    }

    .action-dots-text {
      font-size: 26px;
      letter-spacing: 2px;
      line-height: 1;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    /* ქვედა ინფორმაცია (მხოლოდ მომხმარებლის სახელი) */
    .bottom-info {
      position: absolute;
      left: 15px;
      bottom: 25px;
      color: #ffffff;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .user-handle {
      font-size: 16px;
      font-weight: 700;
    }

    /* ჩატვირთვის ინდიკატორი */
    .loading-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888888;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- ზედა ღილაკი: უკან დაბრუნება -->
  <div class="top-bar">
    <button type="button" class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  </div>

  <div class="viewer-container" id="slidesViewport">
    <div class="loading-state" id="loadingText">ფოტოები იტვირთება...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAj8VZVZYI_UVZlflTQk3MAljdS5Rxfrv0",
      authDomain: "gabji-b583c.firebaseapp.com",
      projectId: "gabji-b583c",
      storageBucket: "gabji-b583c.firebasestorage.app",
      messagingSenderId: "359136388859",
      appId: "1:359136388859:web:5c3448fecd29052755f25e",
      measurementId: "G-CM03PR8K8S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const targetUid = params.get("uid");
    const initialPhotoId = params.get("photoId");

    const viewport = document.getElementById("slidesViewport");
    const loadingText = document.getElementById("loadingText");

    const loadCollection = async (currentUserUid) => {
      if (!targetUid) {
        if (loadingText) loadingText.textContent = "პროფილი ვერ მოიძებნა";
        return;
      }

      try {
        // 1. მომხმარებლის სახელის გაგება
        let userHandle = "@user";
        const userDoc = await getDoc(doc(db, "users", targetUid));
        if (userDoc.exists()) {
          const u = userDoc.data();
          userHandle = u.username ? `@${u.username}` : (u.firstName ? `@${u.firstName.toUpperCase()} JI` : "@user");
        }

        // 2. მხოლოდ ამ მომხმარებლის ფოტოების წამოღება
        const photosSnap = await getDocs(collection(db, "users", targetUid, "photos"));
        
        if (photosSnap.empty) {
          if (loadingText) loadingText.textContent = "ფოტოები არ არის";
          return;
        }

        if (loadingText) loadingText.remove();

        const isOwner = currentUserUid && (currentUserUid === targetUid);
        let initialSlideElement = null;

        photosSnap.forEach((docItem) => {
          const p = docItem.data();
          if (!p.photoUrl) return;

          const slide = document.createElement("div");
          slide.className = "photo-slide";
          slide.id = `photo_${docItem.id}`;

          // სამი წერტილი მხოლოდ მფლობელისთვის
          const ownerDotsHtml = isOwner ? `
            <button type="button" class="action-btn action-dots-btn" data-photo-id="${docItem.id}">
              <span class="action-dots-text">•••</span>
            </button>
          ` : '';

          slide.innerHTML = `
            <img src="${p.photoUrl}" alt="Photo" class="main-photo">

            <!-- მარჯვენა მენიუ საკუთარი აიკონებით -->
            <div class="right-actions">
              <!-- ლაიქი -->
              <button type="button" class="action-btn">
                <img src="icons/heart.svg" alt="Like" class="action-custom-icon">
                <span class="action-count">${p.likesCount || p.likes || 0}</span>
              </button>

              <!-- კომენტარი -->
              <button type="button" class="action-btn">
                <img src="icons/messages-2.svg" alt="Comment" class="action-custom-icon">
                <span class="action-count">${p.commentsCount || 0}</span>
              </button>

              <!-- გაზიარება / სანიშნე (წარწერის გარეშე) -->
              <button type="button" class="action-btn">
                <img src="icons/bookmark-outline.svg" alt="Bookmark" class="action-custom-icon">
                <span class="action-count">${p.savesCount || 0}</span>
              </button>

              <!-- სამი წერტილი გაზიარების ქვემოთ (მხოლოდ მფლობელისთვის) -->
              ${ownerDotsHtml}
            </div>

            <!-- ქვედა ინფორმაცია (აუდიოს გარეშე) -->
            <div class="bottom-info">
              <div class="user-handle">${userHandle}</div>
            </div>
          `;

          viewport.appendChild(slide);

          if (docItem.id === initialPhotoId) {
            initialSlideElement = slide;
          }
        });

        // გადახვევა არჩეულ ფოტოზე
        if (initialSlideElement) {
          initialSlideElement.scrollIntoView();
        }

      } catch (err) {
        console.error("დათვალიერების შეცდომა:", err);
        if (loadingText) loadingText.textContent = "შეცდომა ჩატვირთვისას";
      }
    };

    // ვამოწმებთ მიმდინარე მომხმარებელს, რათა სამი წერტილი მხოლოდ მფლობელზე გამოჩნდეს
    onAuthStateChanged(auth, (user) => {
      loadCollection(user ? user.uid : null);
    });
  </script>
</body>
</html>
