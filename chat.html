<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ჩატი</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .chat-screen-wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      position: relative;
    }

    /* 1. ზედა პანელი ზუსტად სურათის მიხედვით */
    .chat-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #f0f2f5;
      background: #ffffff;
      z-index: 10;
    }

    .top-left-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .btn-back-chat {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .btn-back-chat svg {
      width: 24px;
      height: 24px;
      stroke: #111111;
      stroke-width: 2.4;
      fill: none;
    }

    .top-user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #f0f2f5;
    }

    .top-user-meta {
      display: flex;
      flex-direction: column;
    }

    .top-user-name {
      font-size: 15px;
      font-weight: 700;
      color: #111111;
    }

    .top-user-status {
      font-size: 12px;
      color: #8a8d91;
    }

    .top-right-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111111;
    }

    .top-action-btn svg {
      width: 22px;
      height: 22px;
      stroke: #111111;
      stroke-width: 2;
      fill: none;
    }

    /* 2. შეტყობინებების ველი */
    .messages-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #ffffff;
      -webkit-overflow-scrolling: touch;
    }

    .messages-viewport::-webkit-scrollbar {
      display: none;
    }

    .date-divider {
      text-align: center;
      font-size: 12px;
      color: #8a8d91;
      margin: 14px 0 8px 0;
      font-weight: 500;
    }

    /* ბუშტების განლაგება */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      width: 100%;
    }

    .msg-row.outgoing {
      justify-content: flex-end;
    }

    .msg-row.incoming {
      justify-content: flex-start;
    }

    .msg-incoming-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 2px;
      flex-shrink: 0;
    }

    /* გამგზავნი (ჩვენი): შავი ბუშტი თეთრი ტექსტით */
    .bubble-out {
      background-color: #000000;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.4;
      max-width: 76%;
      word-break: break-word;
    }

    /* მიმღები (თანამოსაუბრე): ღია რუხი ბუშტი შავი ტექსტით */
    .bubble-in {
      background-color: #f0f2f5;
      color: #050505;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.4;
      max-width: 76%;
      word-break: break-word;
    }

    /* 3. ქვედა საწერი პანელი ზუსტად სურათის მსგავსად */
    .chat-bottom-input-bar {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: #ffffff;
      border-top: 1px solid #f0f2f5;
      gap: 10px;
      z-index: 10;
    }

    .input-pill-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #e4e6eb;
      border-radius: 24px;
      padding: 4px 14px;
      gap: 8px;
    }

    .chat-text-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      padding: 8px 0;
      font-size: 15px;
      color: #111111;
    }

    .chat-text-input::placeholder {
      color: #8a8d91;
    }

    .input-inline-icons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-inline-icon {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      color: #737373;
    }

    .btn-inline-icon svg {
      width: 22px;
      height: 22px;
      stroke: #737373;
      stroke-width: 1.8;
      fill: none;
    }

    .btn-chat-send {
      background: #000000;
      border: none;
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-chat-send svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
      transform: translateX(1px);
    }
  </style>
</head>
<body>

  <div class="chat-screen-wrap">
    
    <!-- ზედა პანელი: ნავიგაცია, სახელი, სტატუსი, ზარი, ვიდეო -->
    <div class="chat-top-bar">
      <div class="top-left-profile" id="topProfileTarget">
        <button type="button" class="btn-back-chat" onclick="history.back()">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <img src="icons/user-circle-linear.svg" class="top-user-avatar" id="chatTargetAvatar" alt="Avatar">
        <div class="top-user-meta">
          <span class="top-user-name" id="chatTargetName">მომხმარებელი</span>
          <span class="top-user-status" id="chatTargetStatus">აქტიური იყო 11წთ წინ</span>
        </div>
      </div>

      <div class="top-right-actions">
        <!-- აუდიო ზარი -->
        <button type="button" class="top-action-btn" aria-label="Call">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <!-- ვიდეო ზარი -->
        <button type="button" class="top-action-btn" aria-label="Video">
          <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        </button>
      </div>
    </div>

    <!-- შეტყობინებების ნაკადი -->
    <div class="messages-viewport" id="messagesViewport">
      <div class="date-divider" id="chatDateDivider">დღეს</div>
    </div>

    <!-- ქვედა საწერი პანელი -->
    <div class="chat-bottom-input-bar">
      <div class="input-pill-wrap">
        <input type="text" class="chat-text-input" id="messageInput" placeholder="Message..." autocomplete="off">
        <div class="input-inline-icons">
          <!-- მიკროფონი -->
          <button type="button" class="btn-inline-icon">
            <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>
          <!-- სმაილიკი -->
          <button type="button" class="btn-inline-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
          </button>
          <!-- სურათი -->
          <button type="button" class="btn-inline-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          </button>
        </div>
      </div>
      <button type="button" class="btn-chat-send" id="btnSendMessage" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc, 
      setDoc, 
      serverTimestamp,
      query,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAj8VZVZYI_UVZlflTQk3MAljdS5Rxfrv0",
      authDomain: "gabji-b583c.firebaseapp.com",
      projectId: "gabji-b583c",
      storageBucket: "gabji-b583c.firebasestorage.app",
      messagingSenderId: "359136388859",
      appId: "1:359136388859:web:5c3448fecd29052755f25e",
      measurementId: "G-CM03PR8K8S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get("uid");

    const chatTargetAvatar = document.getElementById("chatTargetAvatar");
    const chatTargetName = document.getElementById("chatTargetName");
    const chatTargetStatus = document.getElementById("chatTargetStatus");
    const messagesViewport = document.getElementById("messagesViewport");
    const messageInput = document.getElementById("messageInput");
    const btnSendMessage = document.getElementById("btnSendMessage");
    const topProfileTarget = document.getElementById("topProfileTarget");

    let currentTargetData = null;
    let currentUserData = null;

    if (topProfileTarget && targetUid) {
      topProfileTarget.onclick = (e) => {
        if (e.target.closest(".btn-back-chat")) return;
        window.location.href = `profile.html?uid=${targetUid}`;
      };
    }

    // უნიკალური ჩატის ID ორი მომხმარებლისთვის (ანბანური დალაგებით)
    const getChatId = (uid1, uid2) => {
      return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
    };

    // შეტყობინების გაგზავნა
    const sendMessage = async () => {
      const text = messageInput.value.trim();
      if (!text || !targetUid || !auth.currentUser) return;

      const myUid = auth.currentUser.uid;
      const chatId = getChatId(myUid, targetUid);

      messageInput.value = "";

      try {
        const msgColRef = collection(db, "chats", chatId, "messages");
        await setDoc(doc(msgColRef), {
          senderUid: myUid,
          text: text,
          createdAt: serverTimestamp()
        });

        // ორივე მომხმარებლის ინბოქსის განახლება
        const myName = currentUserData ? `${currentUserData.firstName || ''} ${currentUserData.lastName || ''}`.trim() : 'მომხმარებელი';
        const targetName = currentTargetData ? `${currentTargetData.firstName || ''} ${currentTargetData.lastName || ''}`.trim() : 'მომხმარებელი';

        await setDoc(doc(db, "users", myUid, "chats", targetUid), {
          lastMessage: text,
          userName: targetName,
          userPhoto: currentTargetData?.photoUrl || null,
          updatedAt: serverTimestamp()
        }, { merge: true });

        await setDoc(doc(db, "users", targetUid, "chats", myUid), {
          lastMessage: text,
          userName: myName,
          userPhoto: currentUserData?.photoUrl || null,
          updatedAt: serverTimestamp()
        }, { merge: true });

      } catch (err) {
        console.error("შეტყობინების გაგზავნის შეცდომა:", err);
      }
    };

    if (btnSendMessage) btnSendMessage.onclick = sendMessage;
    if (messageInput) {
      messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    }

    // შეტყობინებების რეალურ დროში (Realtime) მოსმენა
    const listenMessages = (myUid) => {
      const chatId = getChatId(myUid, targetUid);
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));

      onSnapshot(q, (snapshot) => {
        messagesViewport.innerHTML = '<div class="date-divider">Nov 30, 2026, 9:41 AM</div>';

        snapshot.forEach((docItem) => {
          const m = docItem.data();
          const isMe = m.senderUid === myUid;

          const row = document.createElement("div");
          row.className = `msg-row ${isMe ? 'outgoing' : 'incoming'}`;

          if (isMe) {
            row.innerHTML = `<div class="bubble-out">${m.text}</div>`;
          } else {
            const avatarSrc = currentTargetData?.photoUrl || 'icons/user-circle-linear.svg';
            row.innerHTML = `
              <img src="${avatarSrc}" class="msg-incoming-avatar" alt="Avatar">
              <div class="bubble-in">${m.text}</div>
            `;
          }

          messagesViewport.appendChild(row);
        });

        messagesViewport.scrollTop = messagesViewport.scrollHeight;
      });
    };

    // ინიციალიზაცია
    onAuthStateChanged(auth, async (currentUser) => {
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }

      if (!targetUid) {
        alert("მომხმარებელი არ არის მითითებული");
        window.location.href = "messages.html";
        return;
      }

      try {
        // ჩვენი პროფილი
        const mySnap = await getDoc(doc(db, "users", currentUser.uid));
        if (mySnap.exists()) currentUserData = mySnap.data();

        // თანამოსაუბრის პროფილი
        const targetSnap = await getDoc(doc(db, "users", targetUid));
        if (targetSnap.exists()) {
          currentTargetData = targetSnap.data();
          const fullName = `${currentTargetData.firstName || ''} ${currentTargetData.lastName || ''}`.trim() || 'მომხმარებელი';
          if (chatTargetName) chatTargetName.textContent = fullName;
          if (chatTargetAvatar && currentTargetData.photoUrl) {
            chatTargetAvatar.src = currentTargetData.photoUrl;
          }
        }

        listenMessages(currentUser.uid);

      } catch (err) {
        console.error("ჩატის ინიციალიზაციის შეცდომა:", err);
      }
    });
  </script>
</body>
</html>
