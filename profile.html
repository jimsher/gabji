<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GABJI - პროფილი</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1585.0/aws-sdk.min.js"></script>
</head>
<body>

  <div class="app-screen profile-screen">
    <div class="content-layer profile-layout">

      <!-- ზედა ჰედერი (მხოლოდ უკან დაბრუნება, პარამეტრები და ავატარი) -->
      <div class="profile-header-card">
        <div class="profile-top-actions">
          <a href="feed.html" class="icon-btn-round" aria-label="Back">
            <img src="icons/undo-2.svg" alt="Back" class="svg-icon">
          </a>
          <button type="button" class="icon-btn-round" id="btnSettingsProfile" aria-label="Settings">
            <img src="icons/settings.svg" alt="Settings" class="svg-icon">
          </button>
        </div>

        <!-- ავატარი და სტატუსი -->
        <div class="profile-avatar-wrap">
          <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">
          <div class="profile-avatar-ring" id="avatarRingBtn" style="cursor: pointer;" title="ფოტოს შეცვლა">
            <img id="profileMainAvatar" src="" alt="Avatar" class="profile-avatar-img" style="display: none;">
            <img id="profileAvatarPlaceholder" src="icons/user-circle-linear.svg" alt="User" class="avatar-placeholder-icon">
            <span class="avatar-online-dot"></span>
          </div>

          <div class="profile-status-badge">
            <span class="status-green-dot"></span>
            <span id="uploadProgressText">აქტიურია</span>
          </div>
        </div>
      </div>

      <!-- ღილაკები განლაგებულია ავატარისა და „აქტიურიას“ ქვემოთ -->
      <div class="profile-mid-actions">
        <!-- მარცხნივ: დაფოლოვება -->
        <button type="button" class="action-mid-btn btn-follow" id="btnFollow">
          <img src="icons/user-round-plus.svg" alt="Follow" class="btn-mid-icon">
          <span>Follow</span>
        </button>

        <!-- ცენტრში: რედაქტირება -->
        <button type="button" class="action-mid-btn btn-edit-center" id="btnEditProfile">
          <img src="icons/pencil-line.svg" alt="Edit" class="btn-mid-icon">
          <span>რედაქტირება</span>
        </button>

        <!-- მარჯვნივ: ჩატი -->
        <button type="button" class="action-mid-btn btn-message" id="btnMessage">
          <img src="icons/send.svg" alt="Send" class="btn-mid-icon">
          <span>ჩატი</span>
        </button>
      </div>

      <!-- ფოტოების 6-იანი გალერეა -->
      <div class="profile-gallery-grid" id="profileGallery">
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
      </div>

      <!-- მომხმარებლის დეტალები -->
      <div class="profile-info-block">
        <h2 class="profile-name" id="profileName">იტვირთება...</h2>
        <p class="profile-distance" id="profileDistance">ლოკაცია</p>
        <p class="profile-bio" id="profileBio"></p>
      </div>

    </div>
  </div>

  <!-- ქვედა ნავიგაცია -->
  <nav class="bottom-nav-bar">
    <a href="feed.html" class="nav-item">
      <img src="icons/home-outline.svg" alt="Feed" class="nav-svg-icon">
      <span>ფიდი</span>
    </a>
    <a href="#" class="nav-item">
      <img src="icons/message-circle.svg" alt="Chat" class="nav-svg-icon">
      <span>ჩატი</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <img src="icons/user-bold.svg" alt="Profile" class="nav-svg-icon">
      <span>პროფილი</span>
    </a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
