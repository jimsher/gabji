<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GABJI - პროფილი</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-screen profile-screen">
    <div class="content-layer profile-layout">

      <!-- ზედა ჰედერი ფონური გრადიენტით -->
      <div class="profile-header-card">
        <div class="profile-top-actions">
          <a href="feed.html" class="icon-btn-round" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </a>
          <button type="button" class="icon-btn-round" aria-label="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>

        <!-- მთავარი ავატარი -->
        <div class="profile-avatar-wrap">
          <div class="profile-avatar-ring">
            <img id="profileMainAvatar" src="" alt="Avatar" class="profile-avatar-img" style="display: none;">
            <svg id="profileAvatarPlaceholder" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span class="avatar-online-dot"></span>
          </div>
          <div class="profile-status-badge">
            <span class="status-green-dot"></span>
            <span>აქტიურია</span>
          </div>
        </div>
      </div>

      <!-- ფოტოების 6-იანი გალერეა -->
      <div class="profile-gallery-grid" id="profileGallery">
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
        <div class="gallery-photo-slot"></div>
      </div>

      <!-- მომხმარებლის დეტალები -->
      <div class="profile-info-block">
        <h2 class="profile-name" id="profileName">იტვირთება...</h2>
        <p class="profile-distance" id="profileDistance">მანძილი — 20 კმ</p>
        <p class="profile-bio" id="profileBio"></p>
      </div>

      <!-- მოქმედების ღილაკები -->
      <div class="profile-action-row">
        <button type="button" class="profile-btn btn-edit" id="btnEditProfile">რედაქტირება</button>
        <button type="button" class="profile-btn btn-settings" id="btnSettingsProfile">პარამეტრები</button>
      </div>

    </div>
  </div>

  <!-- დამოუკიდებელი ქვედა ნავიგაცია -->
  <nav class="bottom-nav-bar">
    <a href="feed.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>ფიდი</span>
    </a>
    <a href="#" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>ჩატი</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>პროფილი</span>
    </a>
  </nav>

  <script type="module" src="app.js"></script>

</body>
</html>
