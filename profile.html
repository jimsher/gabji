<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GABJI - პროფილი</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1585.0/aws-sdk.min.js"></script>
</head>
<body>

  <div class="app-screen profile-screen">
    <div class="content-layer profile-layout">

      <!-- 1. ზედა ნავიგაციის ზოლი -->
      <div class="tt-top-bar">
        <a href="feed.html" class="tt-icon-btn" aria-label="Edit/Back">
          <img src="icons/pencil-line.svg" alt="Edit" class="svg-icon">
        </a>
        <div class="tt-top-right">
          <button type="button" class="tt-icon-btn" aria-label="Add User">
            <img src="icons/user-plus-broken.svg" alt="Add" class="svg-icon">
          </button>
          <button type="button" class="tt-icon-btn" id="btnSettingsProfile" aria-label="Menu">
            <img src="icons/menu.svg" alt="Menu" class="svg-icon">
          </button>
        </div>
      </div>

      <!-- 2. მთავარი პროფილის ბლოკი (სახელი მარცხნივ, ავატარი მარჯვნივ) -->
      <div class="tt-profile-hero">
        
        <!-- მარცხენა მხარე: სახელები და სტატისტიკა -->
        <div class="tt-profile-info">
          <div class="tt-name-wrap">
            <h2 class="tt-display-name" id="profileName">იტვირთება...</h2>
            <img src="icons/undo-2.svg" alt="Arrow" class="tt-name-arrow">
          </div>
          <span class="tt-username" id="profileUsername">@username</span>

          <!-- რეალური სტატისტიკა (გამოწერები, გამომწერები, მოწონებები) -->
          <div class="tt-stats-row">
            <div class="tt-stat-col">
              <span class="tt-stat-num" id="statFollowing">0</span>
              <span class="tt-stat-lbl">გამოწერები</span>
            </div>
            <div class="tt-stat-col">
              <span class="tt-stat-num" id="statFollowers">0</span>
              <span class="tt-stat-lbl">გამომწერი</span>
            </div>
            <div class="tt-stat-col">
              <span class="tt-stat-num" id="statLikes">0</span>
              <span class="tt-stat-lbl">ლაიქები</span>
            </div>
          </div>
        </div>

        <!-- მარჯვენა მხარე: ავატარი + ღილაკით -->
        <div class="tt-avatar-box">
          <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">
          <div class="tt-avatar-ring" id="avatarRingBtn" title="ფოტოს შეცვლა">
            <img id="profileMainAvatar" src="" alt="Avatar" class="tt-avatar-img" style="display: none;">
            <img id="profileAvatarPlaceholder" src="icons/user-circle-linear.svg" alt="User" class="tt-avatar-ph">
            
            <!-- პატარა ცისფერი პლუსის ღილაკი ფოტოს ასატვირთად -->
            <div class="tt-avatar-plus-btn">
              <img src="icons/user-round-plus.svg" alt="Add" class="tt-plus-icon">
            </div>
          </div>
          <span class="tt-status-text" id="uploadProgressText">აქტიური</span>
        </div>

      </div>

      <!-- 3. ქვეყნის დროშა და ლოკაცია -->
      <div class="tt-bio-section">
        <p class="tt-flag-bio" id="profileLocation">🇬🇪 საქართველო</p>
      </div>

      <!-- ახალი: TikTok-ის გამოწერის, შეტყობინების და რეკომენდაციის ღილაკები -->
      <div class="tt-follow-action-row">
        <button type="button" class="tt-btn-subscribe" id="btnFollowAction">გამოწერა</button>
        <button type="button" class="tt-btn-message" id="btnMessageAction">შეტყობინება</button>
        <button type="button" class="tt-btn-suggest" aria-label="Suggest User">
          <img src="icons/user-plus-broken.svg" alt="User Plus" class="tt-suggest-icon">
        </button>
      </div>

      <!-- ქვედა ჩიპსები: რედაქტირება, ბალანსი, პოპულარული -->
      <div class="tt-action-chips">
        <button type="button" class="tt-chip-btn active" id="btnEditProfile">
          <img src="icons/sparkles.svg" alt="Edit" class="tt-chip-icon">
          <span>რედაქტირება</span>
        </button>
        <button type="button" class="tt-chip-btn" id="btnShare">
          <img src="icons/wallet.svg" alt="Wallet" class="tt-chip-icon">
          <span>ბალანსი</span>
        </button>
        <button type="button" class="tt-chip-btn" id="btnBoost">
          <img src="icons/flame.svg" alt="Fire" class="tt-chip-icon">
          <span>პოპულარული</span>
        </button>
      </div>

      <!-- 4. ტაბების მენიუ (Grid / Private / Liked) -->
      <div class="tt-tabs-bar">
        <button type="button" class="tt-tab-item active">
          <img src="icons/gallery-broken.svg" alt="Feed" class="tt-tab-icon">
        </button>
        <button type="button" class="tt-tab-item">
          <img src="icons/clapperboard-play-broken.svg" alt="Reposts" class="tt-tab-icon">
        </button>
        <button type="button" class="tt-tab-item">
          <img src="icons/lock-bold.svg" alt="Private" class="tt-tab-icon">
        </button>
        <button type="button" class="tt-tab-item">
          <img src="icons/bookmark-outline.svg" alt="Saved" class="tt-tab-icon">
        </button>
        <button type="button" class="tt-tab-item">
          <img src="icons/heart.svg" alt="Liked" class="tt-tab-icon">
        </button>
      </div>

      <!-- 5. ფოტოების/ვიდეოების ბადე (3 სვეტად, ვერტიკალური, ნახვების რაოდენობით) -->
      <div class="tt-gallery-grid" id="profileGallery">
        <div class="tt-post-card">
          <div class="tt-post-thumb"></div>
          <div class="tt-post-views">
            <span class="tt-play-triangle">▷</span>
            <span class="tt-views-count">85</span>
          </div>
        </div>
        <div class="tt-post-card">
          <div class="tt-post-thumb"></div>
          <div class="tt-post-views">
            <span class="tt-play-triangle">▷</span>
            <span class="tt-views-count">7587</span>
          </div>
        </div>
        <div class="tt-post-card">
          <div class="tt-post-thumb"></div>
          <div class="tt-post-views">
            <span class="tt-play-triangle">▷</span>
            <span class="tt-views-count">232</span>
          </div>
        </div>
        <div class="tt-post-card">
          <div class="tt-post-thumb"></div>
          <div class="tt-post-views">
            <span class="tt-play-triangle">▷</span>
            <span class="tt-views-count">8219</span>
          </div>
        </div>
        <div class="tt-post-card">
          <div class="tt-post-thumb"></div>
          <div class="tt-post-views">
            <span class="tt-play-triangle">▷</span>
            <span class="tt-views-count">260</span>
          </div>
        </div>
        <div class="tt-post-card">
          <div class="tt-post-thumb"></div>
          <div class="tt-post-views">
            <span class="tt-play-triangle">▷</span>
            <span class="tt-views-count">271</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- TikTok სტილის ქვედა ნავიგაცია -->
  <nav class="bottom-nav-bar">
    <!-- 1. მთავარი / ფიდი -->
    <a href="feed.html" class="nav-item">
      <img src="icons/home-outline.svg" alt="Home" class="nav-svg-icon">
      <span>ფიდი</span>
    </a>

    <!-- 2. მეგობრები / რელსები -->
    <a href="#" class="nav-item">
      <img src="icons/users-group-rounded-bold.svg" alt="Friends" class="nav-svg-icon">
      <span>მეგობრები</span>
    </a>

    <!-- 3. ცენტრალური ატვირთვის ღილაკი (+) -->
    <div class="nav-item nav-upload-wrap">
      <button type="button" class="tiktok-plus-btn" id="navUploadBtn" aria-label="Upload">
        <span class="plus-symbol">+</span>
      </button>
    </div>

    <!-- 4. შემოსულები / ჩატი წითელი ბეიჯით -->
    <a href="#" class="nav-item nav-inbox-wrap">
      <div class="nav-icon-badge-box">
        <img src="icons/message-circle.svg" alt="Inbox" class="nav-svg-icon">
        <span class="nav-unread-badge">26</span>
      </div>
      <span>შემოსულები</span>
    </a>

    <!-- 5. პროფილი -->
    <a href="profile.html" class="nav-item active">
      <img src="icons/user-bold.svg" alt="Profile" class="nav-svg-icon">
      <span>პროფილი</span>
    </a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
