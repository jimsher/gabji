<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>კამერა და ატვირთვა - GABJI</title>

  <!-- AWS SDK Cloudflare R2-ში ვიდეოს პირდაპირი ატვირთვისთვის -->
  <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1692.0.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .camera-screen {
      position: relative;
      width: 100%;
      max-width: 412px;
      height: 100vh;
      background: #000000;
      overflow: hidden;
    }

    /* კამერის რეალური ვიდეო ნაკადი */
    #cameraStream {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    /* ზედა პანელი */
    .top-controls {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-close-cam {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-add-music {
      background: rgba(0, 0, 0, 0.45);
      border: none;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
    }

    /* მარჯვენა ხელსაწყოების სვეტი */
    .right-tools {
      position: absolute;
      right: 14px;
      top: 14px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }

    .tool-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
    }

    .tool-btn span {
      font-size: 10px;
      font-weight: 600;
    }

    /* ქვედა მართვის ბლოკი */
    .bottom-camera-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
    }

    .timer-modes {
      display: flex;
      gap: 18px;
      margin-bottom: 24px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
    }

    .timer-modes .mode-item {
      cursor: pointer;
    }

    .timer-modes .mode-item.active {
      color: #ffffff;
      background: rgba(0,0,0,0.6);
      padding: 2px 10px;
      border-radius: 12px;
    }

    .record-row {
      width: 100%;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    /* გალერეის ღილაკი */
    .btn-gallery-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid #ffffff;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .btn-gallery-box::after {
      content: "";
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1.5px solid rgba(255,255,255,0.4);
      z-index: -1;
    }

    .btn-gallery-box img {
      width: 24px;
      height: 24px;
      filter: brightness(0) invert(1);
    }

    /* ჩამწერი წითელი ღილაკი */
    .btn-record-main {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      padding: 4px;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .record-inner-circle {
      width: 100%;
      height: 100%;
      background: #fe2c55;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .btn-effects-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .effects-avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      overflow: hidden;
    }
    .effects-avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom-mode-text-row {
      display: flex;
      gap: 24px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .bottom-mode-text-row .active-mode {
      color: #ffffff;
    }
    .bottom-mode-text-row .inactive-mode {
      color: rgba(255,255,255,0.45);
    }

    /* ატვირთვის მოდალი */
    .upload-overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    .upload-box {
      background: #18181c;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
    }

    .upload-desc-input {
      width: 100%;
      background: #252528;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 14px;
      margin: 12px 0;
      resize: none;
      outline: none;
    }

    .btn-confirm-upload {
      width: 100%;
      background: #fe2c55;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancel-upload {
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      margin-top: 10px;
      cursor: pointer;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 14px;
      display: none;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #fe2c55;
      transition: width 0.2s;
    }
  </style>
</head>
<body>

  <div class="camera-screen">

    <video id="cameraStream" autoplay playsinline muted></video>

    <div class="top-controls">
      <button class="btn-close-cam" id="btnCloseCamera" aria-label="დახურვა">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>

      <button class="btn-add-music">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span>მუსიკის დამატება</span>
      </button>

      <div style="width: 24px;"></div>
    </div>

    <div class="right-tools">
      <button class="tool-btn" id="btnFlipCamera">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 1.5.4 2.9 1.1 4.1L3 16l4.5-.5c.7.4 1.5.7 2.3.9M4 14c0 4.418 3.582 8 8 8s8-3.582 8-8c0-1.5-.4-2.9-1.1-4.1L21 8l-4.5.5c-.7-.4-1.5-.7-2.3-.9"/></svg>
      </button>
    </div>

    <div class="bottom-camera-controls">
      <div class="timer-modes">
        <span class="mode-item">10 წთ</span>
        <span class="mode-item active">60 წმ</span>
        <span class="mode-item">15 წმ</span>
      </div>

      <div class="record-row">
        <!-- გალერეის ღილაკი -->
        <div class="btn-gallery-box" id="btnOpenGallery" title="გალერეა">
          <img src="icons/gallery-bold.svg" onerror="this.src='icons/bookmark.svg'" alt="Gallery">
        </div>

        <button class="btn-record-main" id="btnRecordVideo">
          <div class="record-inner-circle"></div>
        </button>

        <div class="btn-effects-box">
          <div class="effects-avatar-circle">
            <img src="icons/user-circle-linear.svg" alt="Effects">
          </div>
        </div>
      </div>

      <div class="bottom-mode-text-row">
        <span class="active-mode">კამერა</span>
        <span class="inactive-mode">შემოქმედება</span>
      </div>
    </div>

    <!-- გალერეიდან ვიდეოს ასარჩევი ფაილის ინპუთი -->
    <input type="file" id="reelVideoInput" accept="video/*" style="display: none;">

    <!-- ატვირთვის მოდალი -->
    <div class="upload-overlay-screen" id="uploadOverlay">
      <div class="upload-box">
        <h3 style="font-size: 17px; margin-bottom: 6px;">ვიდეოს გამოქვეყნება</h3>
        <textarea class="upload-desc-input" id="reelDescriptionInput" rows="3" placeholder="დაწერეთ აღწერა..."></textarea>
        
        <button class="btn-confirm-upload" id="btnStartPublish">გამოქვეყნება</button>
        <button type="button" class="btn-cancel-upload" id="btnCancelPublish">გაუქმება</button>

        <div class="progress-bar-bg" id="uploadProgressBar">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div id="uploadStatusText" style="font-size: 12px; color: #aaa; margin-top: 8px;"></div>
      </div>
    </div>

  </div>

  <!-- Firebase და R2 ლოგიკა -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAj8VZVZYI_UVZlflTQk3MAljdS5Rxfrv0",
      authDomain: "gabji-b583c.firebaseapp.com",
      projectId: "gabji-b583c",
      storageBucket: "gabji-b583c.firebasestorage.app",
      messagingSenderId: "359136388859",
      appId: "1:359136388859:web:5c3448fecd29052755f25e",
      measurementId: "G-CM03PR8K8S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const videoEl = document.getElementById("cameraStream");
    const btnClose = document.getElementById("btnCloseCamera");
    const btnFlip = document.getElementById("btnFlipCamera");
    const btnGallery = document.getElementById("btnOpenGallery");
    const videoInput = document.getElementById("reelVideoInput");
    const uploadOverlay = document.getElementById("uploadOverlay");
    const btnPublish = document.getElementById("btnStartPublish");
    const btnCancel = document.getElementById("btnCancelPublish");
    const descInput = document.getElementById("reelDescriptionInput");
    const progressBg = document.getElementById("uploadProgressBar");
    const progressFill = document.getElementById("progressFill");
    const statusText = document.getElementById("uploadStatusText");

    let currentStream = null;
    let facingMode = "user";
    let selectedVideoFile = null;
    let currentAuthUser = null;

    // 1. ცოცხალი კამერა
    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1080 }, height: { ideal: 1920 } },
          audio: true
        });
        videoEl.srcObject = currentStream;
        videoEl.style.transform = facingMode === "user" ? "scaleX(-1)" : "none";
      } catch (err) {
        console.warn("კამერა ვერ ჩაირთო:", err);
      }
    }
    startCamera();

    btnClose.onclick = () => {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      window.history.back();
    };

    btnFlip.onclick = () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    };

    // 2. გალერეის გახსნა
    btnGallery.onclick = () => videoInput.click();

    videoInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      selectedVideoFile = file;
      uploadOverlay.style.display = "flex";
    };

    btnCancel.onclick = () => {
      uploadOverlay.style.display = "none";
      selectedVideoFile = null;
      videoInput.value = "";
    };

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      currentAuthUser = user;
    });

    // 3. R2-ში ატვირთვის ფუნქცია AWS SDK-ით (შენი ზუსტი გასაღებებით)
    function uploadReelToR2(file, onProgress, onComplete) {
      const r2S3 = new AWS.S3({
        endpoint: 'https://b06701b6405e891a274a6d40ae52c940.r2.cloudflarestorage.com',
        accessKeyId: 'fca43a92ab1d3b3e7c89912f8d525977',
        secretAccessKey: 'd051531e40a19cfaedade242eac6b6d506dad44be370224ba2e5c3ea298f1ad6',
        signatureVersion: 'v4',
        region: 'auto',
        s3ForcePathStyle: true
      });

      const fileExt = file.name && file.name.match(/\.(mp4|mov|avi|mkv|webm)$/i) ? file.name.match(/\.(mp4|mov|avi|mkv|webm)$/i)[0] : '.mp4';
      const fileKey = 'videos/' + Date.now() + '_' + Math.random().toString(36).substring(2, 7) + fileExt;

      const params = {
        Bucket: 'emigrantbook-videos',
        Key: fileKey,
        Body: file,
        ContentType: file.type || 'video/mp4',
        CacheControl: 'public, max-age=31536000, immutable'
      };

      const uploader = r2S3.upload(params);

      uploader.on('httpUploadProgress', (evt) => {
        if (evt.total && typeof onProgress === 'function') {
          const percent = Math.round((evt.loaded / evt.total) * 100);
          onProgress(percent);
        }
      });

      uploader.send((err, data) => {
        if (err) {
          console.error("R2 Upload Error:", err);
          onComplete(null, err);
        } else {
          const publicUrl = "https://pub-d077cb13f6ec46cebeca95f2f25b9a08.r2.dev/" + fileKey;
          onComplete(publicUrl, null);
        }
      });
    }

    // 4. გამოქვეყნების ღილაკი: R2 -> Firestore
    btnPublish.onclick = () => {
      if (!selectedVideoFile || !currentAuthUser) return;

      btnPublish.disabled = true;
      btnCancel.style.display = "none";
      progressBg.style.display = "block";
      statusText.textContent = "ვიდეო იტვირთება R2-ზე (0%)...";

      uploadReelToR2(
        selectedVideoFile,
        (percent) => {
          progressFill.style.width = percent + "%";
          statusText.textContent = `ვიდეო იტვირთება R2-ზე (${percent}%)...`;
        },
        async (publicVideoUrl, uploadErr) => {
          if (uploadErr || !publicVideoUrl) {
            statusText.textContent = "ატვირთვის შეცდომა: " + (uploadErr ? uploadErr.message : "უცნობია");
            btnPublish.disabled = false;
            btnCancel.style.display = "block";
            return;
          }

          statusText.textContent = "ინახება ბაზაში...";

          try {
            // ავტორის მონაცემების წამოღება users კოლექციიდან
            let userData = {};
            const userSnap = await getDoc(doc(db, "users", currentAuthUser.uid));
            if (userSnap.exists()) userData = userSnap.data();

            const reelId = `reel_${Date.now()}`;
            await setDoc(doc(db, "reels", reelId), {
              authorUid: currentAuthUser.uid,
              username: userData.username || (userData.firstName ? `${userData.firstName} ${userData.lastName || ""}`.trim() : "user"),
              authorPhoto: userData.photoUrl || "",
              description: descInput.value.trim(),
              music: "ორიგინალი აუდიო",
              videoUrl: publicVideoUrl,
              likesCount: 0,
              commentsCount: 0,
              savesCount: 0,
              sharesCount: 0,
              createdAt: serverTimestamp()
            });

            statusText.textContent = "ვიდეო წარმატებით გამოქვეყნდა!";
            setTimeout(() => {
              if (currentStream) currentStream.getTracks().forEach(t => t.stop());
              window.location.href = "reels.html";
            }, 800);

          } catch (dbErr) {
            console.error("Firestore შეცდომა:", dbErr);
            statusText.textContent = "ბაზაში შენახვის შეცდომა: " + dbErr.message;
            btnPublish.disabled = false;
            btnCancel.style.display = "block";
          }
        }
      );
    };
  </script>
</body>
</html>
