<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>gabji</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-screen">
    <!-- დაბურული ფონის სურათი -->
    <div class="bg-overlay"></div>

    <div class="content-layer">
      <!-- ლოგო -->
      <div class="top-section">
        <h1 class="brand-logo">gabji</h1>
      </div>

      <!-- მთავარი ტექსტი -->
      <div class="hero-text-box">
        <h2 class="hero-title">აღმოაჩინე ახალი<br>ადამიანები</h2>
        <p class="hero-sub">გაიცანი საინტერესო ადამიანები მარტივად და უსაფრთხოდ</p>
      </div>

      <!-- მოქმედების ღილაკები ფოტოს მიხედვით -->
      <div class="actions-container">
        <!-- რეგისტრაცია გადადის პირდაპირ signup.html-ზე -->
        <a href="signup.html" class="btn-gradient">რეგისტრაცია</a>

        <!-- შესვლის მოდალის გამოძახება -->
        <button type="button" class="btn-outline" id="openLoginModal">შესვლა</button>

        <!-- Email-ით პირდაპირი შესვლა -->
        <button type="button" class="btn-outline btn-email" id="quickEmailBtn">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          Email
        </button>

        <!-- Google-ით შესვლა -->
        <button type="button" class="btn-outline btn-google" id="googleLoginBtn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          შესვლა Google-ით
        </button>
      </div>
    </div>
  </div>

  <!-- შესვლის მოდალი (Email & Password) -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3>ავტორიზაცია</h3>
      <input type="email" id="loginEmail" class="input-box" placeholder="ელექტრონული ფოსტა">
      <input type="password" id="loginPass" class="input-box" placeholder="პაროლი">
      <button type="button" class="btn-gradient" id="submitLoginBtn">შესვლა</button>
      <button type="button" class="btn-close" id="closeModalBtn">გაუქმება</button>
    </div>
  </div>

  <!-- ჯავასკრიპტი -->
  <script type="module" src="app.js"></script>
</body>
</html>
