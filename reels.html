<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
  <title>Reels - GABJI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* მობილურის ეკრანის კონტეინერი */
    .reels-screen {
      position: relative;
      width: 100%;
      max-width: 412px;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    /* ვერტიკალური Snap სქროლერი */
    .reels-feed {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
    }
    .reels-feed::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    /* ერთი ვიდეოს ბარათი */
    .reel-item {
      position: relative;
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #111;
      overflow: hidden;
    }

    .reel-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ზედა ზოლი (ლაივი, ჩანართები, ძებნა) */
    .reels-top-bar {
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .btn-live {
      background: none;
      border: 1px solid rgba(255,255,255,0.7);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .top-tabs {
      display: flex;
      gap: 16px;
      font-size: 16px;
      font-weight: 600;
    }

    .tab-item {
      color: rgba(255, 255, 255, 0.65);
      cursor: pointer;
      position: relative;
      padding-bottom: 4px;
    }

    .tab-item.active {
      color: #ffffff;
      font-weight: 700;
    }
    .tab-item.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
    }

    .top-search-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    /* მარჯვენა მოქმედების ღილაკები */
    .reels-sidebar {
      position: absolute;
      right: 12px;
      bottom: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    /* ავატარი პლუსით */
    .author-avatar-wrap {
      position: relative;
      margin-bottom: 6px;
    }

    .author-avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      object-fit: cover;
    }

    .btn-avatar-plus {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      background: #fe2c55;
      color: #ffffff;
      border-radius: 50%;
      border: none;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
    }

    .action-icon-wrap {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
    }

    .action-icon-wrap svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }

    .action-count {
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .btn-like.liked svg {
      fill: #fe2c55;
    }

    /* მბრუნავი მუსიკალური დისკი */
    .music-disc-wrap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #252525;
      padding: 7px;
      border: 7px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 5s linear infinite;
    }

    .music-disc-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* ქვედა ინფორმაცია (ავტორი, აღწერა, მუსიკა) */
    .reel-meta {
      position: absolute;
      left: 14px;
      bottom: 80px;
      max-width: 78%;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .meta-username {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .meta-description {
      font-size: 13.5px;
      line-height: 1.35;
      color: #f1f1f1;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta-music {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #fff;
    }

    /* ქვედა ნავიგაცია (TikTok სტილის ზუსტი მენიუ) */
    
    /* ცენტრალური შექმნის პლუს ღილაკი */
    .btn-create-reel {
      position: relative;
      width: 44px;
      height: 30px;
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-create-reel::before,
    .btn-create-reel::after {
      content: "";
      position: absolute;
      top: 0;
      width: 10px;
      height: 100%;
      border-radius: 6px;
      z-index: -1;
    }
    .btn-create-reel::before {
      left: -4px;
      background: #20d5ec;
    }
    .btn-create-reel::after {
      right: -4px;
      background: #fe2c55;
    }
    .btn-create-reel svg {
      stroke: #000000;
      width: 18px;
      height: 18px;
    }

    .reel-action-icon {
      width: 35px;
      height: 35px;
      display: block;
      filter: brightness(0) invert(1);
      pointer-events: none;
    }
    
    /* სისტემური Play ღილაკის გაქრობა */
    video::-webkit-media-controls,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-overlay-play-button {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
    }

    .reel-video {
      background-color: #000000;
    }
  </style>
</head>
<body>

  <div class="reels-screen">

    <!-- ზედა ფიქსირებული ზოლი -->
    <header class="reels-top-bar">
      

      <div class="top-tabs">
        <div class="tab-item" id="tabFollowing">გამოწერები</div>
        <div class="tab-item active" id="tabForYou">რეკომენდაციები</div>
      </div>

      <button class="top-search-btn" aria-label="ძებნა">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </header>

    <!-- ვიდეოების სქროლ კონტეინერი -->
    <main class="reels-feed" id="reelsContainer">
      <!-- JavaScript ჩატვირთავს ვიდეოებს დინამიკურად Firebase / R2-დან -->
    </main>

    <!-- ქვედა ნავიგაცია -->
    <!-- TikTok სტილის ქვედა ნავიგაცია -->
    <nav class="bottom-nav-bar">
      <!-- 1. მთავარი / ფიდი -->
      <a href="feed.html" class="nav-item">
        <img src="icons/home-outline.svg" alt="Home" class="nav-svg-icon">
        <span>ფიდი</span>
      </a>

      <!-- 2. მეგობრები / რელსები -->
      <a href="users.html" class="nav-item">
        <img src="icons/users-group-rounded-bold.svg" alt="Friends" class="nav-svg-icon">
        <span>მეგობრები</span>
      </a>

      <!-- 3. ცენტრალური ატვირთვის ღილაკი (+) -->
      <div class="nav-item nav-upload-wrap">
       <button type="button" class="tiktok-plus-btn" onclick="window.location.href='camera.html'" aria-label="Upload">
      <span class="plus-symbol">+</span>
      </button>
     </div>


      <!-- 4. შემოსულები / ჩატი წითელი ბეიჯით -->
      <a href="#" class="nav-item nav-inbox-wrap">
        <div class="nav-icon-badge-box">
          <img src="icons/message-circle.svg" alt="Inbox" class="nav-svg-icon">
          <span class="nav-unread-badge">26</span>
        </div>
        <span>შემოსულები</span>
      </a>

      <!-- 5. პროფილი -->
      <a href="profile.html" class="nav-item active">
        <img src="icons/user-broken.svg" alt="Profile" class="nav-svg-icon">
        <span>პროფილი</span>
      </a>
    </nav>
    
  </div>

  <!-- Firebase და Reels-ის მუშა ლოგიკა -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAj8VZVZYI_UVZlflTQk3MAljdS5Rxfrv0",
      authDomain: "gabji-b583c.firebaseapp.com",
      projectId: "gabji-b583c",
      storageBucket: "gabji-b583c.firebasestorage.app",
      messagingSenderId: "359136388859",
      appId: "1:359136388859:web:5c3448fecd29052755f25e",
      measurementId: "G-CM03PR8K8S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const container = document.getElementById("reelsContainer");

    // 1x1 შავი პოსტერი Base64-ში, რათა სისტემური Play ღილაკი WebView-მ არ დახატოს
    const blackPoster = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";

    // რეალური მონაცემების მასივი (მაკეტების გარეშე)
    let reelsData = [];

    onAuthStateChanged(auth, async (currentUser) => {
      // 1. რეალური ვიდეოების წამოღება Firestore-დან (კოლექცია: reels)
      try {
        const snap = await getDocs(collection(db, "reels"));
        reelsData = [];

        if (!snap.empty) {
          for (const d of snap.docs) {
            const rData = d.data();
            let authorName = rData.username || "";
            let authorPhoto = rData.authorPhoto || rData.photoUrl || "";

            // თუ reel დოკუმენტში ავტორის პროფილი არ წერია, წამოვიღოთ users-დან
            if ((!authorName || !authorPhoto) && rData.authorUid) {
              try {
                const uSnap = await getDoc(doc(db, "users", rData.authorUid));
                if (uSnap.exists()) {
                  const uData = uSnap.data();
                  if (!authorName) {
                    authorName = uData.username ? `@${uData.username}` : `${uData.firstName || ""} ${uData.lastName || ""}`.trim();
                  }
                  if (!authorPhoto && uData.photoUrl) {
                    authorPhoto = uData.photoUrl;
                  }
                }
              } catch (uErr) {
                console.error("ავტორის ჩატვირთვის შეცდომა:", uErr);
              }
            }

            reelsData.push({
              id: d.id,
              authorUid: rData.authorUid || rData.userId || "",
              username: authorName || "user",
              authorPhoto: authorPhoto || "icons/user-circle-linear.svg",
              description: rData.description || "",
              music: rData.music || "ორიგინალი აუდიო",
              videoUrl: rData.videoUrl || "",
              likes: rData.likesCount || rData.likes || 0,
              comments: rData.commentsCount || rData.comments || 0,
              saves: rData.savesCount || rData.saves || 0,
              shares: rData.sharesCount || rData.shares || 0
            });
          }
        }
      } catch (e) {
        console.error("Firestore Reels Collection შეცდომა:", e);
      }

      function renderReels(items, currentUser) {
        container.innerHTML = "";

        // თუ ბაზაში ვიდეო არ დევს, ყალბი მაკეტის ნაცვლად გამოდის სუფთა განულებული მდგომარეობა
        if (!items || items.length === 0) {
          container.innerHTML = `
            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; color:#888; font-size:15px; text-align:center; padding:20px;">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#6d6682" stroke-width="1.8" style="margin-bottom:12px;">
                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                <line x1="7" y1="2" x2="7" y2="22"></line>
                <line x1="17" y1="2" x2="17" y2="22"></line>
                <line x1="2" y1="12" x2="22" y2="12"></line>
              </svg>
              <div style="font-size:16px; font-weight:600; color:#ffffff; margin-bottom:6px;">ვიდეოები ჯერ არ არის</div>
              <div style="font-size:13px; color:#6d6682;">Firestore-ში ვიდეო არ მოიძებნა</div>
            </div>
          `;
          return;
        }

        items.forEach((item, index) => {
          const itemEl = document.createElement("div");
          itemEl.className = "reel-item";
          itemEl.dataset.id = item.id;

          itemEl.innerHTML = `
            <!-- ვიდეო პლეიერი Base64 პოსტერით -->
            <video class="reel-video" src="${item.videoUrl}" poster="${blackPoster}" loop muted playsinline webkit-playsinline preload="metadata"></video>

            <!-- მარჯვენა მოქმედების პანელი -->
            <div class="reels-sidebar">
              <div class="author-avatar-wrap">
                <img src="${item.authorPhoto || 'icons/user-circle-linear.svg'}" class="author-avatar-img" alt="Avatar">
                <button class="btn-avatar-plus" data-uid="${item.authorUid}">+</button>
              </div>

              <button class="action-item btn-like" data-id="${item.id}">
                <div class="action-icon-wrap">
                  <img src="icons/heart-bold.svg" class="reel-action-icon" alt="Like">
                </div>
                <span class="action-count like-count">${item.likes || 0}</span>
              </button>

              <button class="action-item btn-comment">
                <div class="action-icon-wrap">
                  <img src="icons/chat-round-dots-bold.svg" class="reel-action-icon" alt="Comment">
                </div>
                <span class="action-count">${item.comments || 0}</span>
              </button>

              <button class="action-item btn-save">
                <div class="action-icon-wrap">
                  <img src="icons/bookmark-bold.svg" class="reel-action-icon" alt="Save">
                </div>
                <span class="action-count">${item.saves || 0}</span>
              </button>

              <button class="action-item btn-share">
                <div class="action-icon-wrap">
                  <img src="icons/forward-right-bold.svg" class="reel-action-icon" alt="Share">
                </div>
                <span class="action-count">${item.shares || 0}</span>
              </button>

              <div class="music-disc-wrap">
                <img src="${item.authorPhoto || 'icons/user-circle-linear.svg'}" alt="Disc">
              </div>
            </div>

            <!-- ქვედა მეტა ინფორმაცია -->
            <div class="reel-meta">
              <div class="meta-username" onclick="window.location.href='profile.html?uid=${item.authorUid}'">${item.username.startsWith('@') ? item.username : '@' + item.username}</div>
              <div class="meta-description">${item.description}</div>
              <div class="meta-music">
                <img src="icons/music.svg" style="width: 14px; height: 14px; filter: brightness(0) invert(1);" alt="Music">
                <span>${item.music}</span>
              </div>
            </div>
          `;

          // ვიდეოზე შეხებისას Pause / Play და ხმის ჩართვა
          const video = itemEl.querySelector(".reel-video");
          video.onclick = () => {
            if (video.paused) {
              video.muted = false;
              video.play();
            } else {
              video.pause();
            }
          };

          // Like-ის ფუნქციონალი ბაზასთან კავშირში
          const likeBtn = itemEl.querySelector(".btn-like");
          const likeCountEl = itemEl.querySelector(".like-count");
          let isLiked = false;

          likeBtn.onclick = async () => {
            let count = parseInt(likeCountEl.textContent) || 0;
            if (!isLiked) {
              count += 1;
              likeBtn.classList.add("liked");
              isLiked = true;
            } else {
              count = Math.max(0, count - 1);
              likeBtn.classList.remove("liked");
              isLiked = false;
            }
            likeCountEl.textContent = count;

            if (currentUser) {
              try {
                await setDoc(doc(db, "reels", item.id, "likes", currentUser.uid), {
                  liked: isLiked,
                  time: serverTimestamp()
                });
              } catch (err) {
                console.error("Like Error:", err);
              }
            }
          };

          // ავტორის გამოწერა პირდაპირ ვიდეოდან (+)
          const plusBtn = itemEl.querySelector(".btn-avatar-plus");
          plusBtn.onclick = async (e) => {
            e.stopPropagation();
            if (currentUser) {
              try {
                await setDoc(doc(db, "users", currentUser.uid, "following", item.authorUid), {
                  followedUid: item.authorUid,
                  active: true,
                  createdAt: serverTimestamp()
                });
                plusBtn.style.display = "none";
              } catch (e) {
                console.error("Follow Error:", e);
              }
            }
          };

          container.appendChild(itemEl);
        });
      }

      // გამოძახება ეკრანზე რეალური მონაცემების დასახატად
      renderReels(reelsData, currentUser);
      initIntersectionObserver();
    });

    // ავტომატური Play / Pause სქროლვისას (Intersection Observer)
    function initIntersectionObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          const video = entry.target.querySelector(".reel-video");
          if (video) {
            if (entry.isIntersecting) {
              video.play().catch(() => {});
            } else {
              video.pause();
              video.currentTime = 0;
            }
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll(".reel-item").forEach((el) => observer.observe(el));
    }
  </script>
</body>
</html>
