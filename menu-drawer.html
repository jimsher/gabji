<!-- გვერდის დაბნელება (Overlay) -->
<div class="menu-backdrop" id="menuBackdrop"></div>

<!-- მარჯვნიდან გამომავალი პანელი (Drawer) -->
<aside class="menu-drawer" id="menuDrawer">
  <div class="menu-drawer-scroll">

    <!-- 1. რესურსები -->
    <div class="menu-group">
      <span class="menu-group-title">რესურსები</span>
      <div class="menu-item" id="menuItemBalance">
        <div class="menu-item-left">
          <img src="icons/wallet.svg" alt="Wallet" class="menu-item-icon">
          <span class="menu-item-text">ბალანსი</span>
        </div>
        <span class="menu-item-arrow">›</span>
      </div>
    </div>

    <!-- 2. პირადი ინსტრუმენტები -->
    <div class="menu-group">
      <span class="menu-group-title">პირადი ხელსაწყოები</span>
      <div class="menu-item">
        <div class="menu-item-left">
          <img src="icons/clock.svg" onerror="this.src='icons/pencil-line.svg'" alt="Activity" class="menu-item-icon">
          <span class="menu-item-text">აქტივობების ცენტრი</span>

        <span class="menu-item-arrow">›</span>
      </div>

      <div class="menu-item">
        <div class="menu-item-left">
          <img src="icons/download.svg" onerror="this.src='icons/bookmark.svg'" alt="Offline" class="menu-item-icon">

        </div>
        <span class="menu-item-arrow">›</span>
      </div>

      <div class="menu-item">
        <div class="menu-item-left">
          <img src="icons/qr-code.svg" onerror="this.src='icons/gallery-broken.svg'" alt="QR" class="menu-item-icon">
          <span class="menu-item-text">თქვენი QR კოდი</span>
        </div>
        <span class="menu-item-arrow">›</span>
      </div>
    </div>

    <!-- 3. შემოქმედება და ბიზნესი -->
    <div class="menu-group">
      <span class="menu-group-title">შემოქმედება და ბიზნესი</span>
      <div class="menu-item">
        <div class="menu-item-left">
          <img src="icons/store.svg" onerror="this.src='icons/sparkles.svg'" alt="Business" class="menu-item-icon">
          <span class="menu-item-text">ინსტრუმენტები ბიზნესისთვის</span>
        </div>
        <span class="menu-item-arrow">›</span>

      <div class="menu-item">
        <div class="menu-item-left">
          <img src="icons/clapperboard-play-broken.svg" alt="Studio" class="menu-item-icon">
          <span class="menu-item-text">GABJI Studio</span>
        </div>
        <span class="menu-item-arrow">›</span>
      </div>

      <div class="menu-item">
        <div class="menu-item-left">
          <img src="icons/flame.svg" alt="Boost" class="menu-item-icon">
          <span class="menu-item-text">პოპულარიზაცია</span>
        </div>
        <span class="menu-item-arrow">›</span>
      </div>

    <div class="menu-group menu-group-last">
      <div class="menu-item" id="menuItemSettings">
        <div class="menu-item-left">
          <img src="icons/settings.svg" onerror="this.src='icons/menu.svg'" alt="Settings" class="menu-item-icon">
          <span class="menu-item-text">პარამეტრები და კონფიდენციალურობა</span>
